# Preserve the public scheme supplied by the trusted host proxy.
map $http_x_forwarded_proto $progena_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://progena-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $progena_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /v1/ {
        proxy_pass http://progena-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $progena_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Docker-only liveness exception; no application data is served here.
    location = /healthz {
        proxy_pass http://progena-backend:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $progena_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 10s;
    }

    location = /metrics {
        proxy_pass http://progena-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $progena_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
