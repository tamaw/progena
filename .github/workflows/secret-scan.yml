name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional exclusive base commit SHA; blank scans only the dispatch ref tip.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-new-commits:
    name: Scan new commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out scan target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download and run trusted gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
          MANUAL_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          readonly gitleaks_version=8.30.1
          readonly gitleaks_archive_sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          readonly gitleaks_config_sha256=e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf
          readonly gitleaks_source_commit=83d9cd684c87d95d656c1458ef04895a7f1cbd8e
          readonly zero_sha=0000000000000000000000000000000000000000

          is_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]]
          }

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BEFORE"
              head_sha="$PUSH_AFTER"
              ;;
            workflow_dispatch)
              base_sha="$MANUAL_BASE_SHA"
              head_sha="$MANUAL_HEAD_SHA"
              ;;
            *)
              echo "Unsupported event."
              exit 1
              ;;
          esac

          if ! is_sha "$head_sha"; then
            echo "The event did not provide a valid head commit SHA."
            exit 1
          fi

          git cat-file -e "${head_sha}^{commit}"

          if [[ -z "$base_sha" && "$EVENT_NAME" == workflow_dispatch ]]; then
            base_sha="$(git rev-parse "$head_sha^" 2>/dev/null || true)"
          fi

          if [[ -n "$base_sha" && "$base_sha" != "$zero_sha" ]] && ! is_sha "$base_sha"; then
            echo "The event did not provide a valid base commit SHA."
            exit 1
          fi

          if [[ -n "$base_sha" && "$base_sha" != "$zero_sha" ]]; then
            git cat-file -e "${base_sha}^{commit}"
            log_opts="$base_sha..$head_sha"
          elif git rev-parse -q --verify "${head_sha}^" >/dev/null; then
            log_opts="${head_sha}^..$head_sha"
          else
            log_opts="$head_sha"
          fi

          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          printf '%s  %s\n' "$gitleaks_archive_sha256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          chmod 0755 "$RUNNER_TEMP/gitleaks/gitleaks"

          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/gitleaks.toml" \
            "https://raw.githubusercontent.com/gitleaks/gitleaks/${gitleaks_source_commit}/config/gitleaks.toml"
          printf '%s  %s\n' "$gitleaks_config_sha256" "$RUNNER_TEMP/gitleaks.toml" | sha256sum --check --status
          : > "$RUNNER_TEMP/.gitleaksignore"
          # Gitleaks also loads source/.gitleaksignore, even with an explicit path.
          # Read the commit history without trusting suppression files in the checkout.
          mkdir "$RUNNER_TEMP/gitleaks-scan-repo"
          printf 'gitdir: %s\n' "$GITHUB_WORKSPACE/.git" > "$RUNNER_TEMP/gitleaks-scan-repo/.git"

          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --no-banner \
            --redact=100 \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/.gitleaksignore" \
            --ignore-gitleaks-allow \
            --log-opts="$log_opts" \
            "$RUNNER_TEMP/gitleaks-scan-repo"
