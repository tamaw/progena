name: prune

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune-docker:
    if: ${{ github.repository == 'tamaw/progena' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, Linux, docker]
    steps:
      - name: Capture Docker disk usage (before)
        id: before
        run: |
          docker system df
          {
            echo "df<<EOF"
            docker system df
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prune unused Docker artifacts
        shell: bash
        run: |
          # No label filter: sweeps every unused image regardless of source,
          # including GitHub Actions runner and ephemeral job images, not just
          # ones tagged ai.progena.managed=true.
          docker image prune -af \
            --filter "until=168h" || true

          docker builder prune -af \
            --filter "until=168h" || true

          if docker buildx version >/dev/null 2>&1; then
            docker buildx prune -af \
              --filter "until=168h" || true
          fi

          docker container prune -f \
            --filter "until=168h" || true

          docker network prune -f \
            --filter "until=168h" || true

          # Anonymous unused volumes only; named volumes are surfaced in the
          # summary below (not auto-removed) since a stopped-but-expected
          # container may still legitimately own one.
          docker volume prune -f || true

      - name: Report disk usage and reclaimable space
        if: always()
        run: |
          {
            echo "## Docker prune summary"
            echo
            echo "### Before"
            echo '```'
            echo "${{ steps.before.outputs.df }}"
            echo '```'
            echo
            echo "### After"
            echo '```'
            docker system df
            echo '```'
            echo
            echo "### Unattached named volumes (not auto-pruned)"
            echo '```'
            vols=$(docker volume ls -f dangling=true --format '{{.Name}}')
            if [ -z "$vols" ]; then
              echo "(none)"
            else
              for v in $vols; do
                size=$(docker run --rm -v "$v":/data:ro alpine du -sh /data 2>/dev/null | cut -f1)
                echo "$v: ${size:-unknown}"
              done
            fi
            echo '```'
            echo
            echo "### Host disk usage"
            echo '```'
            df -h / /var 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
