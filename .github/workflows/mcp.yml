name: mcp

# Minimal MCP workflow: build+push+deploy on merge to main or manual dispatch.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode: changed (diff HEAD^..HEAD) or all mcps"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all
  push:
    branches:
      - main
    paths:
      - "app/mcp/**"
      - ".github/workflows/mcp.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: [self-hosted, Linux]
    outputs:
      mcps: ${{ steps.collect.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main for workflow dispatch diff
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Resolve main base SHA
        id: base-sha
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        run: echo "sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"

      - name: List all MCP servers
        id: list-all
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'all'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const skip = new Set(['__pycache__', '.git', 'base', '.venv', 'node_modules']);
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'app/mcp',
              ref: context.sha,
            });
            return JSON.stringify(
              data
                .filter((entry) => entry.type === 'dir' && !entry.name.startsWith('.') && !skip.has(entry.name))
                .map((entry) => entry.name)
                .sort(),
            );

      - name: Detect changed MCP files (push)
        id: changed-push
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@v46
        with:
          json: true
          files: |
            app/mcp/**

      - name: Detect changed MCP files (dispatch)
        id: changed-dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        uses: tj-actions/changed-files@v46
        with:
          json: true
          files: |
            app/mcp/**
          base_sha: ${{ steps.base-sha.outputs.sha }}
          sha: ${{ github.sha }}

      - name: Build changed MCP matrix
        id: changed-mcps
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'all'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed-push.outputs.all_changed_files || steps.changed-dispatch.outputs.all_changed_files }}
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = path.join(process.env.GITHUB_WORKSPACE, 'app', 'mcp');
            const changedFiles = JSON.parse(process.env.CHANGED_FILES || '[]');
            const mcps = [...new Set(
              changedFiles
                .filter((file) => file.startsWith('app/mcp/'))
                .map((file) => file.split('/')[2])
                .filter((name) => name && fs.existsSync(path.join(root, name)) && fs.statSync(path.join(root, name)).isDirectory()),
            )].sort();
            return JSON.stringify(mcps);

      - name: Finalize MCP output
        id: collect
        uses: actions/github-script@v7
        env:
          ALL_MCPS: ${{ steps.list-all.outputs.result }}
          CHANGED_MCPS: ${{ steps.changed-mcps.outputs.result }}
        with:
          result-encoding: string
          script: |
            return process.env.ALL_MCPS || process.env.CHANGED_MCPS || '[]';

  build-mcp:
    needs: detect-changes
    if: needs.detect-changes.outputs.mcps != '[]' && needs.detect-changes.outputs.mcps != ''
    runs-on: [self-hosted, Linux, docker]
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.detect-changes.outputs.mcps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate MCP Dockerfile exists
        run: |
          test -f "app/mcp/${{ matrix.mcp }}/Dockerfile" \
            || { echo "Dockerfile app/mcp/${{ matrix.mcp }}/Dockerfile not found"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/mcp/${{ matrix.mcp }}/Dockerfile
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=mcp
          tags: |
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-mcp:
    needs: [detect-changes, build-mcp]
    if: needs.detect-changes.outputs.mcps != '[]' && needs.detect-changes.outputs.mcps != ''
    runs-on: [self-hosted, Linux, docker]
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.detect-changes.outputs.mcps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate MCP directory exists
        run: |
          test -d "app/mcp/${{ matrix.mcp }}" \
            || { echo "MCP directory app/mcp/${{ matrix.mcp }} not found"; exit 1; }
          test -f "app/mcp/${{ matrix.mcp }}/Dockerfile" \
            || { echo "Dockerfile app/mcp/${{ matrix.mcp }}/Dockerfile not found"; exit 1; }

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Ensure external network
        run: docker network inspect progenitor_network >/dev/null 2>&1 || docker network create progenitor_network

      - name: Pull MCP image
        run: docker pull ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest

      - name: Stop existing container (if any)
        run: docker rm -f progenitor-mcp-${{ matrix.mcp }} 2>/dev/null || true

      - name: Run MCP container
        run: |
          docker run -d \
            --name progenitor-mcp-${{ matrix.mcp }} \
            --restart unless-stopped \
            --network progenitor_network \
            -e TEST_MODE=false \
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest

      - name: Wait for MCP server to become healthy
        shell: bash
        run: |
          CONTAINER_NAME="progenitor-mcp-${{ matrix.mcp }}"

          wait_healthy() {
            local name="$1"
            local attempts="${2:-30}"
            local i status
            for i in $(seq 1 "$attempts"); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "$name is healthy"
                return 0
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 2
            done
            echo "Timed out waiting for $name to become healthy (status=$status)"
            docker logs "$name" --tail 50 || true
            return 1
          }

          echo "Waiting for MCP ${{ matrix.mcp }} to become healthy..."
          if ! wait_healthy "${CONTAINER_NAME}" 30; then
            echo "MCP ${{ matrix.mcp }} failed health check"
            exit 1
          fi
