name: secret-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Print secret lengths (safe)
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          AZURE_RESPONSES_API_KEY: ${{ secrets.AZURE_RESPONSES_API_KEY }}
          PROGENITOR_MCP_API_KEY: ${{ secrets.PROGENITOR_MCP_API_KEY }}
        run: |
          echo "LITELLM_MASTER_KEY_len=${#LITELLM_MASTER_KEY}"
          echo "AZURE_RESPONSES_API_KEY_len=${#AZURE_RESPONSES_API_KEY}"
          echo "PROGENITOR_MCP_API_KEY_len=${#PROGENITOR_MCP_API_KEY}"

