name: progenitor-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    environment: cronix
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          # Allow values to come from Environment secrets/vars (cronix) or repo-level secrets.
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
        run: |
          test -n "$LITELLM_MASTER_KEY" || (echo "Missing/empty secret: LITELLM_MASTER_KEY" && exit 1)

      - name: Write env file
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          PROGENITOR_MODEL_DEFAULT: ${{ secrets.PROGENITOR_MODEL_DEFAULT || vars.PROGENITOR_MODEL_DEFAULT }}
          PROGENITOR_TIMEZONE: ${{ secrets.PROGENITOR_TIMEZONE || vars.PROGENITOR_TIMEZONE }}
        run: |
          cat > .progenitor.env <<EOF
          LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
          EOF
          if [ -n "${LITELLM_BASE_URL}" ]; then echo "LITELLM_BASE_URL=${LITELLM_BASE_URL}" >> .progenitor.env; fi
          if [ -n "${PROGENITOR_MODEL_DEFAULT}" ]; then echo "PROGENITOR_MODEL_DEFAULT=${PROGENITOR_MODEL_DEFAULT}" >> .progenitor.env; fi
          if [ -n "${PROGENITOR_TIMEZONE}" ]; then echo "PROGENITOR_TIMEZONE=${PROGENITOR_TIMEZONE}" >> .progenitor.env; fi

      - name: Ensure external network
        run: docker network inspect langfuse_network >/dev/null 2>&1 || docker network create langfuse_network

      - name: Build frontend image (sanity)
        run: docker build -f docker/frontend/Dockerfile app/frontend -t progenitor-frontend:cronix

      - name: Deploy progenitor stack
        run: |
          docker compose --env-file .progenitor.env -f docker/docker-compose.progenitor.yml up -d --build
          docker compose -f docker/docker-compose.progenitor.yml ps

      - name: Liveness checks
        run: |
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          docker exec progenitor python /app/scripts/healthcheck.py

