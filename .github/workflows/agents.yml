name: agents

# Single workflow for agents: test on PRs, build+push+deploy on merge to main.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode: changed (diff HEAD^..HEAD) or all agents/mcps"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all
  push:
    paths:
      - "app/agents/**"
      - "app/mcp/**"
      - "docker/runner/**"
      - ".github/workflows/agents.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  runner-context:
    runs-on: self-hosted
    outputs:
      uid: ${{ steps.ids.outputs.uid }}
      gid: ${{ steps.ids.outputs.gid }}
    steps:
      - name: Capture runner uid/gid
        id: ids
        run: |
          RUN_UID="$(id -u)"
          RUN_GID="$(id -g)"
          echo "uid=${RUN_UID}" >> "$GITHUB_OUTPUT"
          echo "gid=${RUN_GID}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ discover
  discover-agents:
    needs: runner-context
    runs-on: self-hosted
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover agents
        id: list
        run: |
          set -euo pipefail
          agents=$(find app/agents -mindepth 1 -maxdepth 1 -type d \
            ! -name '__pycache__' ! -name '.*' \
            -exec basename {} \; | sort | jq -R . | jq -sc .)
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "Discovered agents: $agents"

  # ------------------------------------------------------------------ test
  test-agent:
    needs: [runner-context, discover-agents]
    runs-on: [self-hosted, Linux]
    container:
      image: python:3.12-slim
      options: --user ${{ needs.runner-context.outputs.uid }}:${{ needs.runner-context.outputs.gid }}
      volumes:
        - /var/cache/gh-pip:/github/home/.cache/pip
    env:
      PIP_CACHE_DIR: /github/home/.cache/pip
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover-agents.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          if [ -f "app/agents/${{ matrix.agent }}/requirements.txt" ]; then
            pip install -r "app/agents/${{ matrix.agent }}/requirements.txt"
          fi
          pip install ruff pyright
          pip install -e . --no-deps

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          TARGETS="app/agents/${{ matrix.agent }}"
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          [ -d "$TEST_DIR" ] && TARGETS="$TARGETS $TEST_DIR"
          ruff check $TARGETS

      - name: Type-check (pyright)
        run: |
          . .venv/bin/activate
          pyright "app/agents/${{ matrix.agent }}"

      - name: Tests (pytest)
        run: |
          . .venv/bin/activate
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          if [ -d "$TEST_DIR" ]; then
            pytest "$TEST_DIR" -q
          else
            echo "No tests found for ${{ matrix.agent }}, skipping."
          fi

  # ------------------------------------------------------------------ detect changes (main/dispatch only)
  detect-changes:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: runner-context
    runs-on: [self-hosted, Linux]
    outputs:
      agents: ${{ steps.diff.outputs.agents }}
      mcps: ${{ steps.diff.outputs.mcps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed agents and MCP servers
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: python .github/scripts/detect_changed_components.py

  # ------------------------------------------------------------------ build + push agents
  build-agent:
    needs: [test-agent, detect-changes]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect agent Dockerfile
        id: dockerfile
        run: |
          if [ -f "app/agents/${{ matrix.agent }}/Dockerfile" ]; then
            echo "file=app/agents/${{ matrix.agent }}/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=docker/runner/Dockerfile.agent" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=agent
          tags: |
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ deploy agents
  deploy-agent:
    needs: [detect-changes, build-agent]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: self-hosted
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate agent directory exists
        run: |
          test -d "app/agents/${{ matrix.agent }}" \
            || { echo "Agent directory app/agents/${{ matrix.agent }} not found"; exit 1; }
          test -f "app/agents/${{ matrix.agent }}/Dockerfile" \
            || { echo "Dockerfile app/agents/${{ matrix.agent }}/Dockerfile not found"; exit 1; }

      - name: Resolve agent runtime config
        id: runtime
        env:
          AGENT_NAME: ${{ matrix.agent }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
          PROGENITOR_MODEL_DEFAULT: ${{ vars.PROGENITOR_MODEL_DEFAULT }}
          PROGENITOR_MODEL_PLANNER: ${{ vars.PROGENITOR_MODEL_PLANNER }}
          PROGENITOR_MODEL_BUILDER: ${{ vars.PROGENITOR_MODEL_BUILDER }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          PROGENITOR_REPO_URL: https://github.com/tamaw/progenitor.git
          TEST_MODE: "false"
        run: python .github/scripts/get_agent_runtime_config.py

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull agent image
        run: docker pull ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest

      - name: Stop existing container (if any)
        run: docker rm -f progenitor-agent-${{ matrix.agent }} 2>/dev/null || true

      - name: Run agent container
        env:
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
          PROGENITOR_MODEL_DEFAULT: ${{ vars.PROGENITOR_MODEL_DEFAULT }}
          PROGENITOR_MODEL_PLANNER: ${{ vars.PROGENITOR_MODEL_PLANNER }}
          PROGENITOR_MODEL_BUILDER: ${{ vars.PROGENITOR_MODEL_BUILDER }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          PROGENITOR_REPO_URL: https://github.com/tamaw/progenitor.git
          TEST_MODE: "false"
        run: |
          PORT=${{ steps.runtime.outputs.port }}
          VOLUME_ARGS="${{ steps.runtime.outputs.volume_args }}"
          CHOWN_PATHS="${{ steps.runtime.outputs.chown_paths }}"
          ENV_ARGS="${{ steps.runtime.outputs.env_args }}"

          PROGENITOR_REPO_URL="https://github.com/tamaw/progenitor.git"
          if [ -n "${GH_TOKEN}" ]; then
            PROGENITOR_REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/tamaw/progenitor.git"
          fi

          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          CHOWN_PATHS="$(echo "${CHOWN_PATHS}" | xargs)"
          for HOST_PATH in ${CHOWN_PATHS}; do
            if [ ! -e "${HOST_PATH}" ]; then
              if command -v sudo >/dev/null 2>&1; then
                sudo mkdir -p "${HOST_PATH}" || mkdir -p "${HOST_PATH}"
              else
                mkdir -p "${HOST_PATH}"
              fi
            fi
          done

          if [ -n "${CHOWN_PATHS}" ]; then
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -R "${HOST_UID}:${HOST_GID}" ${CHOWN_PATHS} || \
                chown -R "${HOST_UID}:${HOST_GID}" ${CHOWN_PATHS}
              sudo chmod -R u+rwX ${CHOWN_PATHS} || chmod -R u+rwX ${CHOWN_PATHS}
            else
              chown -R "${HOST_UID}:${HOST_GID}" ${CHOWN_PATHS}
              chmod -R u+rwX ${CHOWN_PATHS}
            fi
          fi

          # Ensure canonical progenitor runtime dirs are writable even if path
          # detection misses or prior root-owned files remain.
          for HOST_PATH in /var/lib/progenitor/data /var/lib/progenitor/logs /var/lib/progenitor/worktrees; do
            if command -v sudo >/dev/null 2>&1; then
              sudo mkdir -p "${HOST_PATH}" || mkdir -p "${HOST_PATH}"
              sudo chown -R "${HOST_UID}:${HOST_GID}" "${HOST_PATH}" || chown -R "${HOST_UID}:${HOST_GID}" "${HOST_PATH}"
              sudo chmod -R u+rwX "${HOST_PATH}" || chmod -R u+rwX "${HOST_PATH}"
            else
              mkdir -p "${HOST_PATH}"
              chown -R "${HOST_UID}:${HOST_GID}" "${HOST_PATH}"
              chmod -R u+rwX "${HOST_PATH}"
            fi
          done

          # Let each image use its own USER/entrypoint ownership model.
          docker run -d \
            --name progenitor-agent-${{ matrix.agent }} \
            --restart unless-stopped \
            --network progenitor_network \
            -e A2A_PUBLIC_HOST=progenitor-agent-${{ matrix.agent }} \
            -p ${PORT}:${PORT} \
            ${VOLUME_ARGS} \
            ${ENV_ARGS} \
            "ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest"

      - name: Wait for agent to become healthy
        id: health
        run: |
          PORT=${{ steps.runtime.outputs.port }}
          CONTAINER_NAME="progenitor-agent-${{ matrix.agent }}"
          REGISTRY_HOST="${CONTAINER_NAME}"
          DOCKER_HOSTNAME="$(docker inspect --format '{{.Config.Hostname}}' "${CONTAINER_NAME}")"
          if [ -z "${DOCKER_HOSTNAME}" ]; then
            echo "Could not resolve Docker hostname for ${CONTAINER_NAME}"
            exit 1
          fi
          echo "docker_hostname=${DOCKER_HOSTNAME}" >> "$GITHUB_OUTPUT"
          echo "registry_host=${REGISTRY_HOST}" >> "$GITHUB_OUTPUT"

          echo "Waiting for agent ${{ matrix.agent }} on ${DOCKER_HOSTNAME}:${PORT}..."
          for i in $(seq 1 30); do
            if docker exec "${CONTAINER_NAME}" \
              python -c "import httpx; r = httpx.get('http://${DOCKER_HOSTNAME}:${PORT}/health'); r.raise_for_status()" 2>/dev/null; then
              echo "Agent ${{ matrix.agent }} is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Agent ${{ matrix.agent }} failed health check"
          docker logs progenitor-agent-${{ matrix.agent }} --tail 50
          exit 1

      - name: Register agent in progenitor registry
        if: success()
        env:
          AGENT_NAME: ${{ matrix.agent }}
          PORT: ${{ steps.runtime.outputs.port }}
          DOCKER_HOSTNAME: ${{ steps.health.outputs.registry_host }}
          PROGENITOR_CONTAINER: progenitor
        run: python .github/scripts/register_agent.py

      - name: Cleanup unused managed images
        if: success()
        run: |
          docker image prune -af \
            --filter "label=com.progenitor.managed=true" \
            --filter "until=168h" || true

  # ------------------------------------------------------------------ build + push mcps
  build-mcp:
    needs: detect-changes
    if: needs.detect-changes.outputs.mcps != '[]' && needs.detect-changes.outputs.mcps != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.detect-changes.outputs.mcps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runner/Dockerfile.mcp
          build-args: |
            MCP_NAME=${{ matrix.mcp }}
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=mcp
          tags: |
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ deploy mcps
  deploy-mcp:
    needs: [detect-changes, build-mcp]
    if: needs.detect-changes.outputs.mcps != '[]' && needs.detect-changes.outputs.mcps != ''
    runs-on: self-hosted
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.detect-changes.outputs.mcps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate MCP directory exists
        run: |
          test -d "app/mcp/${{ matrix.mcp }}" \
            || { echo "MCP directory app/mcp/${{ matrix.mcp }} not found"; exit 1; }

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull MCP image
        run: docker pull ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest

      - name: Stop existing container (if any)
        run: docker rm -f progenitor-mcp-${{ matrix.mcp }} 2>/dev/null || true

      - name: Run MCP container
        run: |
          docker run -d \
            --name progenitor-mcp-${{ matrix.mcp }} \
            --restart unless-stopped \
            --network progenitor_network \
            -e TEST_MODE=false \
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest

      - name: Wait for MCP server to become healthy
        run: |
          echo "Waiting for MCP container to start..."
          for i in $(seq 1 30); do
            if docker exec progenitor-mcp-${{ matrix.mcp }} \
              python -c "import httpx; r = httpx.get('http://localhost:8080/health'); r.raise_for_status()" 2>/dev/null; then
              echo "MCP ${{ matrix.mcp }} is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MCP ${{ matrix.mcp }} failed health check"
          docker logs progenitor-mcp-${{ matrix.mcp }} --tail 50
          exit 1

      - name: Cleanup unused managed images
        if: success()
        run: |
          docker image prune -af \
            --filter "label=com.progenitor.managed=true" \
            --filter "until=168h" || true
