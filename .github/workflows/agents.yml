name: agents

# Single workflow for agents: test on PRs, build+push+deploy on merge to main.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build/deploy target: agents changed vs origin/main, or all agents (manual runs still test all agents)"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all
  push:
    paths:
      - "app/agents/**"
      - "docker/agents/**"
      # Keep workflow edits push-triggering so branch fixes can be validated
      # through the same build and deploy path they modify.
      - ".github/workflows/agents.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------ discover
  discover-agents:
    runs-on: self-hosted
    outputs:
      agents: ${{ steps.list.outputs.result }}
    steps:
      - name: Discover agents
        id: list
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const skip = new Set(['__pycache__', '.git', 'base', '.venv', 'node_modules']);
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'app/agents',
              ref: context.sha,
            });
            return JSON.stringify(
              data
                .filter((entry) => entry.type === 'dir' && !entry.name.startsWith('.') && !skip.has(entry.name))
                .map((entry) => entry.name)
                .sort(),
            );

  # ------------------------------------------------------------------ test
  test-agent:
    needs: [discover-agents]
    runs-on: [self-hosted, Linux, python]
    env:
      AGENT_NAME: ${{ matrix.agent }}
      PIP_CACHE_DIR: /tmp/pip-cache
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover-agents.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Python deps
        run: |
          mkdir -p "$PIP_CACHE_DIR"
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ -f "app/agents/${{ matrix.agent }}/requirements.txt" ]; then
            pip install -r "app/agents/${{ matrix.agent }}/requirements.txt"
          fi

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          TARGETS="app/agents/${{ matrix.agent }}"
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          [ -d "$TEST_DIR" ] && TARGETS="$TARGETS $TEST_DIR"
          ruff check $TARGETS

      - name: Type-check (pyright)
        run: |
          . .venv/bin/activate
          pyright "app/agents/${{ matrix.agent }}"

      - name: Tests (pytest)
        run: |
          . .venv/bin/activate
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          if [ -d "$TEST_DIR" ]; then
            pytest "$TEST_DIR" -q
          else
            echo "No tests found for ${{ matrix.agent }}, skipping."
          fi

  # ------------------------------------------------------------------ detect changes (main/dispatch only)
  detect-changes:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux]
    outputs:
      agents: ${{ steps.collect.outputs.result }}
    steps:
      - name: Normalize workspace ownership
        run: |
          WORKSPACE_OWNER="$(stat -c '%u:%g' "$(dirname "$GITHUB_WORKSPACE")")"
          mkdir -p "$GITHUB_WORKSPACE"
          chown -R "$WORKSPACE_OWNER" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main for workflow dispatch diff
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Resolve main base SHA
        id: base-sha
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        run: echo "sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"

      - name: List all agents
        id: list-all
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'all'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const skip = new Set(['__pycache__', '.git', 'base', '.venv', 'node_modules']);
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'app/agents',
              ref: context.sha,
            });
            return JSON.stringify(
              data
                .filter((entry) => entry.type === 'dir' && !entry.name.startsWith('.') && !skip.has(entry.name))
                .map((entry) => entry.name)
                .sort(),
            );

      - name: Detect changed agent files (push)
        id: changed-push
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            agents:
              - 'app/agents/*/**'
              - 'docker/agents/**'
              - '.github/workflows/agents.yml'

      - name: Detect changed agent files (dispatch)
        id: changed-dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base-sha.outputs.sha }}
          ref: ${{ github.sha }}
          list-files: json
          filters: |
            agents:
              - 'app/agents/*/**'
              - 'docker/agents/**'
              - '.github/workflows/agents.yml'

      - name: Build changed agent matrix
        id: changed-agents
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'all'
        uses: actions/github-script@v7
        env:
          AGENT_FILES: ${{ steps.changed-push.outputs.agents_files || steps.changed-dispatch.outputs.agents_files }}
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const path = require('path');
            const skip = new Set(['__pycache__', '.git', 'base', '.venv', 'node_modules']);
            const root = path.join(process.env.GITHUB_WORKSPACE, 'app', 'agents');
            const changedFiles = JSON.parse(process.env.AGENT_FILES || '[]');

            const listAllAgents = () =>
              fs.readdirSync(root, { withFileTypes: true })
                .filter((entry) => entry.isDirectory() && !entry.name.startsWith('.') && !skip.has(entry.name))
                .map((entry) => entry.name)
                .sort();

            if (
              changedFiles.some(
                (file) =>
                  file.startsWith('docker/agents/') ||
                  file === '.github/workflows/agents.yml',
              )
            ) {
              return JSON.stringify(listAllAgents());
            }

            const agents = [...new Set(
              changedFiles
                .map((file) => file.split('/')[2])
                .filter(
                  (name) =>
                    name &&
                    !name.startsWith('.') &&
                    !skip.has(name) &&
                    fs.existsSync(path.join(root, name)) &&
                    fs.statSync(path.join(root, name)).isDirectory(),
                ),
            )].sort();
            return JSON.stringify(agents);

      - name: Finalize agent output
        id: collect
        uses: actions/github-script@v7
        env:
          ALL_AGENTS: ${{ steps.list-all.outputs.result }}
          CHANGED_AGENTS: ${{ steps.changed-agents.outputs.result }}
        with:
          result-encoding: string
          script: |
            return process.env.ALL_AGENTS || process.env.CHANGED_AGENTS || '[]';

  # ------------------------------------------------------------------ build + push agents
  build-agent:
    needs: [test-agent, detect-changes]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: [self-hosted, Linux, docker]
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - name: Normalize workspace ownership
        run: |
          WORKSPACE_OWNER="$(stat -c '%u:%g' "$(dirname "$GITHUB_WORKSPACE")")"
          mkdir -p "$GITHUB_WORKSPACE"
          chown -R "$WORKSPACE_OWNER" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Validate agent build assets exist
        run: |
          test -f "docker/agents/Dockerfile" \
            || { echo "Shared Dockerfile docker/agents/Dockerfile not found"; exit 1; }
          test -d "app/agents/${{ matrix.agent }}" \
            || { echo "Agent directory app/agents/${{ matrix.agent }} not found"; exit 1; }
          test -f "app/agents/${{ matrix.agent }}/requirements.txt" \
            || { echo "Requirements file app/agents/${{ matrix.agent }}/requirements.txt not found"; exit 1; }
          test -f "app/agents/${{ matrix.agent }}/docker-entrypoint.sh" \
            || { echo "Entrypoint app/agents/${{ matrix.agent }}/docker-entrypoint.sh not found"; exit 1; }
          test -f "app/agents/${{ matrix.agent }}/agent.yml" \
            || { echo "Runtime manifest app/agents/${{ matrix.agent }}/agent.yml not found"; exit 1; }

      - name: Read agent runtime spec
        id: runtime-spec
        # Pipe the manifest on stdin: container actions bind-mount the workspace by
        # host path, which a containerized self-hosted runner does not share, so
        # their outputs came back empty.
        shell: bash
        run: |
          set -euo pipefail
          SPEC="$(docker run --rm -i mikefarah/yq:4.44.3 -o=json -I=0 '
                .runtime as $runtime |
                {
                  "port": $runtime.port,
                  "mounts": (($runtime.mounts // []) | map(.host_path + ":" + .container_path)),
                  "env_keys": ((["AZURE_OPENAI_BASE_URL", "AZURE_OPENAI_API_KEY", "AGENT_MODEL_DEFAULT"] + ($runtime.additional_env_keys // [])) | unique)
                }
          ' < "app/agents/${{ matrix.agent }}/agent.yml")"
          [[ "$SPEC" =~ \"port\":[0-9]+ ]] || { echo "Invalid runtime spec: $SPEC"; exit 1; }
          echo "result=$SPEC" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agents/Dockerfile
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
            AGENT_PORT=${{ fromJson(steps.runtime-spec.outputs.result).port }}
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=agent
          tags: |
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ deploy agents
  deploy-agent:
    needs: [detect-changes, build-agent]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: [self-hosted, Linux, python, docker]
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - name: Normalize workspace ownership
        run: |
          WORKSPACE_OWNER="$(stat -c '%u:%g' "$(dirname "$GITHUB_WORKSPACE")")"
          mkdir -p "$GITHUB_WORKSPACE"
          chown -R "$WORKSPACE_OWNER" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Validate agent directory exists
        run: |
          test -d "app/agents/${{ matrix.agent }}" \
            || { echo "Agent directory app/agents/${{ matrix.agent }} not found"; exit 1; }
          test -f "app/agents/${{ matrix.agent }}/agent.yml" \
            || { echo "Runtime manifest app/agents/${{ matrix.agent }}/agent.yml not found"; exit 1; }

      - name: Read agent runtime spec
        id: runtime-spec
        # Pipe the manifest on stdin: container actions bind-mount the workspace by
        # host path, which a containerized self-hosted runner does not share, so
        # their outputs came back empty.
        shell: bash
        run: |
          set -euo pipefail
          SPEC="$(docker run --rm -i mikefarah/yq:4.44.3 -o=json -I=0 '
                .runtime as $runtime |
                {
                  "port": $runtime.port,
                  "mounts": (($runtime.mounts // []) | map(.host_path + ":" + .container_path)),
                  "env_keys": ((["AZURE_OPENAI_BASE_URL", "AZURE_OPENAI_API_KEY", "AGENT_MODEL_DEFAULT"] + ($runtime.additional_env_keys // [])) | unique)
                }
          ' < "app/agents/${{ matrix.agent }}/agent.yml")"
          [[ "$SPEC" =~ \"port\":[0-9]+ ]] || { echo "Invalid runtime spec: $SPEC"; exit 1; }
          echo "result=$SPEC" >> "$GITHUB_OUTPUT"

      - name: Ensure external network
        run: docker network inspect progenitor_network >/dev/null 2>&1 || docker network create progenitor_network

      - name: Validate agent manifest
        env:
          RUNTIME_SPEC: ${{ steps.runtime-spec.outputs.result }}
          PROGENITOR_HOST_INSTRUCTIONS_DIR: ${{ github.workspace }}/data/instructions
          PROGENITOR_HOST_SKILLS_DIR: ${{ github.workspace }}/data/skills
        shell: bash
        run: |
          PORT="$(jq -r '.port' <<< "$RUNTIME_SPEC")"
          MOUNT_COUNT="$(jq '.mounts | length' <<< "$RUNTIME_SPEC")"
          ENV_COUNT="$(jq '.env_keys | length' <<< "$RUNTIME_SPEC")"
          [[ "$PORT" =~ ^[0-9]+$ ]] || { echo "Invalid manifest port: $PORT"; exit 1; }
          [ "$MOUNT_COUNT" -gt 0 ] || { echo "No mounts declared in agent manifest"; exit 1; }
          [ "$ENV_COUNT" -gt 0 ] || { echo "No runtime env keys resolved for agent"; exit 1; }
          test -d "$PROGENITOR_HOST_INSTRUCTIONS_DIR" || { echo "Instructions directory not found: $PROGENITOR_HOST_INSTRUCTIONS_DIR"; exit 1; }
          test -d "$PROGENITOR_HOST_SKILLS_DIR" || { echo "Skills directory not found: $PROGENITOR_HOST_SKILLS_DIR"; exit 1; }

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull agent image
        run: docker pull ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest

      - name: Stop existing container (if any)
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: docker rm -f progenitor-agent-${AGENT_NAME} 2>/dev/null || true

      - name: Run agent container
        env:
          AGENT_NAME: ${{ matrix.agent }}
          RUNTIME_SPEC: ${{ steps.runtime-spec.outputs.result }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AGENT_MODEL_DEFAULT: ${{ vars['AGENT_MODEL_DEFAULT'] }}
          OVERRIDE_AGENT_PLANNER_MODEL: ${{ vars['OVERRIDE_AGENT_PLANNER_MODEL'] }}
          OVERRIDE_AGENT_BUILDER_MODEL: ${{ vars['OVERRIDE_AGENT_BUILDER_MODEL'] }}
          DEFAULT_COPILOT_MODEL: ${{ vars['DEFAULT_COPILOT_MODEL'] }}
          PROGENITOR_COPILOT_ADDITIONAL_FLAGS: ${{ vars['PROGENITOR_COPILOT_ADDITIONAL_FLAGS'] }}
          GIT_AUTHOR_NAME: ${{ vars['GIT_AUTHOR_NAME'] }}
          GIT_AUTHOR_EMAIL: ${{ vars['GIT_AUTHOR_EMAIL'] }}
          PROGENITOR_REPO_URL: https://github.com/tamaw/progenitor.git
          PROGENITOR_HOST_INSTRUCTIONS_DIR: ${{ github.workspace }}/data/instructions
          PROGENITOR_HOST_SKILLS_DIR: ${{ github.workspace }}/data/skills
        shell: bash
        run: |
          CONTAINER_NAME="progenitor-agent-${AGENT_NAME}"
          PORT="$(jq -r '.port' <<< "$RUNTIME_SPEC")"
          DOCKER_ARGS=(
            -d
            --name "$CONTAINER_NAME"
            --restart unless-stopped
            --network progenitor_network
            --user 0:0
            --tmpfs /app/tmp:rw,noexec,nosuid,size=512m
            -e "AGENT_NAME=${AGENT_NAME}"
            -e "AGENT_PORT=${PORT}"
            -e "A2A_PUBLIC_HOST=${CONTAINER_NAME}"
            -e "PROGENITOR_DATA_DIR=/app/data"
            -e "PROGENITOR_STATE_DIR=/app/data/state"
            -e "PROGENITOR_INSTRUCTIONS_DIR=/app/data/instructions"
            -e "PROGENITOR_LOG_DIR=/app/logs"
            -e "PROGENITOR_PROJECT_ROOT=/app/worktrees"
            -e "PROGENITOR_WORKTREE_DIR=/app/worktrees/worktrees"
            -e "PROGENITOR_WORKTREES_ROOT=/app/worktrees"
            -v "${PROGENITOR_HOST_INSTRUCTIONS_DIR}:/app/data/instructions:ro"
            -v "${PROGENITOR_HOST_SKILLS_DIR}:/app/data/skills:ro"
          )

          while IFS= read -r mount_spec; do
            [ -n "$mount_spec" ] || continue
            DOCKER_ARGS+=( -v "$mount_spec" )
          done < <(jq -r '.mounts[]' <<< "$RUNTIME_SPEC")

          while IFS= read -r env_key; do
            [ -n "$env_key" ] || continue
            DOCKER_ARGS+=( -e "$env_key" )
          done < <(jq -r '.env_keys[]' <<< "$RUNTIME_SPEC")

          docker run "${DOCKER_ARGS[@]}" "ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest"

      - name: Wait for agent to become healthy
        id: health
        env:
          AGENT_NAME: ${{ matrix.agent }}
        shell: bash
        run: |
          CONTAINER_NAME="progenitor-agent-${AGENT_NAME}"
          echo "registry_host=${CONTAINER_NAME}" >> "$GITHUB_OUTPUT"

          echo "Waiting for agent ${{ matrix.agent }} to become healthy..."
          for _ in $(seq 1 30); do
            STATE="$(docker inspect -f '{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || true)"
            HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_NAME" 2>/dev/null || true)"
            if [ "$HEALTH" = "healthy" ]; then
              echo "$CONTAINER_NAME is healthy"
              exit 0
            fi
            if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ] || [ "$HEALTH" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done

          docker inspect -f 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$CONTAINER_NAME" 2>/dev/null || true
          docker inspect -f '{{if .State.Health}}{{range .State.Health.Log}}{{println .End "exit=" .ExitCode .Output}}{{end}}{{else}}no-healthcheck-log{{end}}' "$CONTAINER_NAME" 2>/dev/null || true
          docker logs "$CONTAINER_NAME" --tail 50 || true
          echo "Agent ${{ matrix.agent }} failed health check" >&2
          exit 1

      - name: Register agent via backend API
        if: success()
        env:
          AGENT_NAME: ${{ matrix.agent }}
          RUNTIME_SPEC: ${{ steps.runtime-spec.outputs.result }}
          DOCKER_HOSTNAME: ${{ steps.health.outputs.registry_host }}
        shell: bash
        run: |
          PORT="$(jq -r '.port' <<< "$RUNTIME_SPEC")"
          PAYLOAD=$(printf '{"name":"%s","url":"http://%s:%s"}' "$AGENT_NAME" "$DOCKER_HOSTNAME" "$PORT")
          docker exec progenitor-backend \
            curl -fsS -X POST http://127.0.0.1:8000/agents/register \
              -H 'content-type: application/json' \
              --data "$PAYLOAD"
