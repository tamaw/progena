name: agents

# Single workflow for agents: test on PRs, build+push+deploy on merge to main.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode: changed (diff HEAD^..HEAD) or all agents"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all
  push:
    paths:
      - "app/agents/**"
      - ".github/workflows/agents.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------ discover
  discover-agents:
    runs-on: self-hosted
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover agents
        id: list
        run: |
          set -euo pipefail
          agents=$(find app/agents -mindepth 1 -maxdepth 1 -type d \
            ! -name '__pycache__' ! -name '.*' \
            -exec basename {} \; | sort | jq -R . | jq -sc .)
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "Discovered agents: $agents"

  # ------------------------------------------------------------------ test
  test-agent:
    needs: [discover-agents]
    runs-on: [self-hosted, Linux]
    container:
      image: python:3.12-slim
    env:
      AGENT_NAME: ${{ matrix.agent }}
      PIP_CACHE_DIR: /tmp/pip-cache
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover-agents.outputs.agents) }}
    steps:
      - name: Normalize workspace ownership
        run: |
          WORKSPACE_OWNER="$(stat -c '%u:%g' "$(dirname "$GITHUB_WORKSPACE")")"
          mkdir -p "$GITHUB_WORKSPACE"
          chown -R "$WORKSPACE_OWNER" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libatomic1

      - name: Install Python deps
        run: |
          mkdir -p "$PIP_CACHE_DIR"
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ -f "app/agents/${{ matrix.agent }}/requirements.txt" ]; then
            pip install -r "app/agents/${{ matrix.agent }}/requirements.txt"
          fi

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          TARGETS="app/agents/${{ matrix.agent }}"
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          [ -d "$TEST_DIR" ] && TARGETS="$TARGETS $TEST_DIR"
          ruff check $TARGETS

      - name: Type-check (pyright)
        run: |
          . .venv/bin/activate
          pyright "app/agents/${{ matrix.agent }}"

      - name: Tests (pytest)
        run: |
          . .venv/bin/activate
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          if [ -d "$TEST_DIR" ]; then
            pytest "$TEST_DIR" -q
          else
            echo "No tests found for ${{ matrix.agent }}, skipping."
          fi

      - name: Restore workspace ownership
        if: ${{ always() }}
        run: |
          WORKSPACE_OWNER="$(stat -c '%u:%g' "$(dirname "$GITHUB_WORKSPACE")")"
          chown -R "$WORKSPACE_OWNER" "$GITHUB_WORKSPACE"

  # ------------------------------------------------------------------ detect changes (main/dispatch only)
  detect-changes:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux]
    outputs:
      agents: ${{ steps.diff.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed agents
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: python .github/scripts/detect_changed_components.py

  # ------------------------------------------------------------------ build + push agents
  build-agent:
    needs: [test-agent, detect-changes]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/agents/${{ matrix.agent }}/Dockerfile
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=agent
          tags: |
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ deploy agents
  deploy-agent:
    needs: [detect-changes, build-agent]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: self-hosted
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate agent directory exists
        run: |
          test -d "app/agents/${{ matrix.agent }}" \
            || { echo "Agent directory app/agents/${{ matrix.agent }} not found"; exit 1; }
          test -f "app/agents/${{ matrix.agent }}/Dockerfile" \
            || { echo "Dockerfile app/agents/${{ matrix.agent }}/Dockerfile not found"; exit 1; }

      - name: Resolve agent runtime config
        id: runtime
        env:
          AGENT_NAME: ${{ matrix.agent }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AGENT_MODEL_DEFAULT: ${{ vars.AGENT_MODEL_DEFAULT }}
          OVERRIDE_AGENT_PLANNER_MODEL: ${{ vars.OVERRIDE_AGENT_PLANNER_MODEL }}
          OVERRIDE_AGENT_BUILDER_MODEL: ${{ vars.OVERRIDE_AGENT_BUILDER_MODEL }}
          DEFAULT_COPILOT_MODEL: ${{ vars.DEFAULT_COPILOT_MODEL }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          PROGENITOR_REPO_URL: https://github.com/tamaw/progenitor.git
          PROGENITOR_DATA_DIR: /app/data
        run: python .github/scripts/get_agent_runtime_config.py

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull agent image
        run: docker pull ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest

      - name: Stop existing container (if any)
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: docker rm -f progenitor-agent-${AGENT_NAME} 2>/dev/null || true

      - name: Run agent container
        env:
          AGENT_NAME: ${{ matrix.agent }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AGENT_MODEL_DEFAULT: ${{ vars.AGENT_MODEL_DEFAULT }}
          OVERRIDE_AGENT_PLANNER_MODEL: ${{ vars.OVERRIDE_AGENT_PLANNER_MODEL }}
          OVERRIDE_AGENT_BUILDER_MODEL: ${{ vars.OVERRIDE_AGENT_BUILDER_MODEL }}
          DEFAULT_COPILOT_MODEL: ${{ vars.DEFAULT_COPILOT_MODEL }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          PROGENITOR_REPO_URL: https://github.com/tamaw/progenitor.git
          PROGENITOR_DATA_DIR: /app/data
        run: |
          CONTAINER_NAME="progenitor-agent-${AGENT_NAME}"
          PORT=${{ steps.runtime.outputs.port }}
          VOLUME_ARGS="${{ steps.runtime.outputs.volume_args }}"
          CHOWN_PATHS="${{ steps.runtime.outputs.chown_paths }}"
          ENV_ARGS="${{ steps.runtime.outputs.env_args }}"
          TMPFS_ARGS="${{ steps.runtime.outputs.tmpfs_args }}"

          PROGENITOR_REPO_URL="https://github.com/tamaw/progenitor.git"
          if [ -n "${GH_TOKEN}" ]; then
            PROGENITOR_REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/tamaw/progenitor.git"
          fi

          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          CHOWN_PATHS="$(echo "${CHOWN_PATHS}" | xargs)"
          for HOST_PATH in ${CHOWN_PATHS}; do
            if [ ! -e "${HOST_PATH}" ]; then
              if command -v sudo >/dev/null 2>&1; then
                sudo mkdir -p "${HOST_PATH}" || mkdir -p "${HOST_PATH}"
              else
                mkdir -p "${HOST_PATH}"
              fi
            fi
          done

          PROMPTS_HOST_DIR="${{ steps.runtime.outputs.prompts_host_dir }}"
          if [ -z "${PROMPTS_HOST_DIR}" ]; then
            PROMPTS_HOST_DIR="/var/lib/progenitor/data/prompts"
          fi
          SKILLS_HOST_DIR="$(dirname "${PROMPTS_HOST_DIR}")/skills"
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p "${PROMPTS_HOST_DIR}" || mkdir -p "${PROMPTS_HOST_DIR}"
            sudo mkdir -p "${SKILLS_HOST_DIR}" || mkdir -p "${SKILLS_HOST_DIR}"
            sudo rm -rf "${PROMPTS_HOST_DIR:?}/"*
            sudo rm -rf "${SKILLS_HOST_DIR:?}/"*
            sudo cp -a data/prompts/. "${PROMPTS_HOST_DIR}/"
            sudo cp -a data/skills/. "${SKILLS_HOST_DIR}/"
            sudo chown -R "${HOST_UID}:${HOST_GID}" "${PROMPTS_HOST_DIR}" || chown -R "${HOST_UID}:${HOST_GID}" "${PROMPTS_HOST_DIR}"
            sudo chown -R "${HOST_UID}:${HOST_GID}" "${SKILLS_HOST_DIR}" || chown -R "${HOST_UID}:${HOST_GID}" "${SKILLS_HOST_DIR}"
            sudo chmod -R u+rwX "${PROMPTS_HOST_DIR}" || chmod -R u+rwX "${PROMPTS_HOST_DIR}"
            sudo chmod -R u+rwX "${SKILLS_HOST_DIR}" || chmod -R u+rwX "${SKILLS_HOST_DIR}"
          else
            mkdir -p "${PROMPTS_HOST_DIR}"
            mkdir -p "${SKILLS_HOST_DIR}"
            rm -rf "${PROMPTS_HOST_DIR:?}/"*
            rm -rf "${SKILLS_HOST_DIR:?}/"*
            cp -a data/prompts/. "${PROMPTS_HOST_DIR}/"
            cp -a data/skills/. "${SKILLS_HOST_DIR}/"
            chown -R "${HOST_UID}:${HOST_GID}" "${PROMPTS_HOST_DIR}"
            chown -R "${HOST_UID}:${HOST_GID}" "${SKILLS_HOST_DIR}"
            chmod -R u+rwX "${PROMPTS_HOST_DIR}"
            chmod -R u+rwX "${SKILLS_HOST_DIR}"
          fi

          if [ -n "${CHOWN_PATHS}" ]; then
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -R "${HOST_UID}:${HOST_GID}" ${CHOWN_PATHS} || \
                chown -R "${HOST_UID}:${HOST_GID}" ${CHOWN_PATHS}
              sudo chmod -R u+rwX ${CHOWN_PATHS} || chmod -R u+rwX ${CHOWN_PATHS}
            else
              chown -R "${HOST_UID}:${HOST_GID}" ${CHOWN_PATHS}
              chmod -R u+rwX ${CHOWN_PATHS}
            fi
          fi

          # Ensure canonical progenitor runtime dirs are writable even if path
          # detection misses or prior root-owned files remain.
          for HOST_PATH in /var/lib/progenitor/data /var/lib/progenitor/logs /var/lib/progenitor/worktrees; do
            if command -v sudo >/dev/null 2>&1; then
              sudo mkdir -p "${HOST_PATH}" || mkdir -p "${HOST_PATH}"
              sudo chown -R "${HOST_UID}:${HOST_GID}" "${HOST_PATH}" || chown -R "${HOST_UID}:${HOST_GID}" "${HOST_PATH}"
              sudo chmod -R u+rwX "${HOST_PATH}" || chmod -R u+rwX "${HOST_PATH}"
            else
              mkdir -p "${HOST_PATH}"
              chown -R "${HOST_UID}:${HOST_GID}" "${HOST_PATH}"
              chmod -R u+rwX "${HOST_PATH}"
            fi
          done

          # Let each image use its own USER/entrypoint ownership model.
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            --network progenitor_network \
            -e AGENT_NAME="${AGENT_NAME}" \
            -e A2A_PUBLIC_HOST="${CONTAINER_NAME}" \
            -e PROGENITOR_DATA_DIR=/app/data \
            -e PROGENITOR_LOG_DIR=/app/logs \
            -e PROGENITOR_PROJECT_ROOT=/app/worktrees \
            -e PROGENITOR_WORKTREE_DIR=/app/worktrees/worktrees \
            -e PROGENITOR_WORKTREES_ROOT=/app/worktrees \
            -e GH_TOKEN="${GH_TOKEN}" \
            -e COPILOT_GITHUB_TOKEN="${COPILOT_GITHUB_TOKEN}" \
            ${VOLUME_ARGS} \
            ${TMPFS_ARGS} \
            ${ENV_ARGS} \
            "ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest"

      - name: Wait for agent to become healthy
        id: health
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: |
          PORT=${{ steps.runtime.outputs.port }}
          CONTAINER_NAME="progenitor-agent-${AGENT_NAME}"
          REGISTRY_HOST="${CONTAINER_NAME}"
          DOCKER_HOSTNAME="$(docker inspect --format '{{.Config.Hostname}}' "${CONTAINER_NAME}")"
          if [ -z "${DOCKER_HOSTNAME}" ]; then
            echo "Could not resolve Docker hostname for ${CONTAINER_NAME}"
            exit 1
          fi
          echo "docker_hostname=${DOCKER_HOSTNAME}" >> "$GITHUB_OUTPUT"
          echo "registry_host=${REGISTRY_HOST}" >> "$GITHUB_OUTPUT"

          echo "Waiting for agent ${{ matrix.agent }} on ${DOCKER_HOSTNAME}:${PORT}..."
          for i in $(seq 1 30); do
            if docker exec "${CONTAINER_NAME}" \
              python -c "import httpx; r = httpx.get('http://${DOCKER_HOSTNAME}:${PORT}/health'); r.raise_for_status()" 2>/dev/null; then
              echo "Agent ${{ matrix.agent }} is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Agent ${{ matrix.agent }} failed health check"
          docker logs progenitor-agent-${{ matrix.agent }} --tail 50
          exit 1

      - name: Register agent in progenitor registry
        if: success()
        env:
          AGENT_NAME: ${{ matrix.agent }}
          PORT: ${{ steps.runtime.outputs.port }}
          DOCKER_HOSTNAME: ${{ steps.health.outputs.registry_host }}
          PROGENITOR_CONTAINER: progenitor
        run: python .github/scripts/register_agent.py

      - name: Cleanup unused managed images
        if: success()
        run: |
          docker image prune -af \
            --filter "label=com.progenitor.managed=true" \
            --filter "until=168h" || true
