name: agents

# Single workflow for agents: test on PRs, build+push+deploy on merge to main.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode: changed (diff HEAD^..HEAD) or all agents/mcps"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all
  push:
    paths:
      - "app/agents/**"
      - "app/mcp/**"
      - "docker/runner/**"
      - ".github/workflows/agents.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------ discover
  discover-agents:
    runs-on: self-hosted
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover agents
        id: list
        run: |
          set -euo pipefail
          agents=$(find app/agents -mindepth 1 -maxdepth 1 -type d \
            ! -name '__pycache__' ! -name '.*' \
            -exec basename {} \; | sort | jq -R . | jq -sc .)
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "Discovered agents: $agents"

  # ------------------------------------------------------------------ test
  test-agent:
    needs: discover-agents
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover-agents.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          if [ -f "app/agents/${{ matrix.agent }}/requirements.txt" ]; then
            pip install -r "app/agents/${{ matrix.agent }}/requirements.txt"
          fi
          pip install ruff pyright
          pip install -e . --no-deps

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint (ruff)
        continue-on-error: ${{ matrix.agent != 'builder_agent' }}
        run: |
          TARGETS="app/agents/${{ matrix.agent }}"
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          [ -d "$TEST_DIR" ] && TARGETS="$TARGETS $TEST_DIR"
          ruff check $TARGETS

      - name: Type-check (pyright)
        continue-on-error: ${{ matrix.agent != 'builder_agent' }}
        run: pyright "app/agents/${{ matrix.agent }}"

      - name: Tests (pytest)
        run: |
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          if [ -d "$TEST_DIR" ]; then
            pytest "$TEST_DIR" -q
          else
            echo "No tests found for ${{ matrix.agent }}, skipping."
          fi

  # ------------------------------------------------------------------ detect changes (main/dispatch only)
  detect-changes:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    outputs:
      agents: ${{ steps.diff.outputs.agents }}
      mcps: ${{ steps.diff.outputs.mcps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed agents and MCP servers
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          MODE="${MODE:-changed}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${MODE}" = "all" ]; then
            AGENTS=$(python -c "import json; from pathlib import Path; skip={'__pycache__','.git','base','.venv','node_modules'}; d=Path('app/agents'); print(json.dumps(sorted([p.name for p in d.iterdir() if p.is_dir() and p.name not in skip and not p.name.startswith('.')])) if d.exists() else [])")
            MCPS=$(python -c "import json; from pathlib import Path; skip={'__pycache__','.git','base','.venv','node_modules'}; d=Path('app/mcp'); print(json.dumps(sorted([p.name for p in d.iterdir() if p.is_dir() and p.name not in skip and not p.name.startswith('.')])) if d.exists() else [])")
          else
            # For workflow_dispatch mode=changed, diff against origin/main...HEAD so we pick up *all* branch changes.
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              if ! git show-ref --verify --quiet refs/remotes/origin/main; then
                git fetch origin main
              fi
              if ! CHANGED=$(git diff --name-only origin/main...HEAD); then
                # If we can't compute a merge-base diff, deploy everything rather than silently skipping.
                MODE="all"
                CHANGED=""
              fi
            else
              # For main pushes we only care about the last commit; HEAD^ may not exist in shallow checkouts.
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                CHANGED=$(git diff --name-only HEAD^ HEAD)
              else
                CHANGED=""
              fi
            fi
            if echo "$CHANGED" | grep -q '^docker/runner/'; then
              MODE="all"
              AGENTS=$(python -c "import json; from pathlib import Path; skip={'__pycache__','.git','base','.venv','node_modules'}; d=Path('app/agents'); print(json.dumps(sorted([p.name for p in d.iterdir() if p.is_dir() and p.name not in skip and not p.name.startswith('.')])) if d.exists() else [])")
              MCPS=$(python -c "import json; from pathlib import Path; skip={'__pycache__','.git','base','.venv','node_modules'}; d=Path('app/mcp'); print(json.dumps(sorted([p.name for p in d.iterdir() if p.is_dir() and p.name not in skip and not p.name.startswith('.')])) if d.exists() else [])")
            else
              AGENTS=$(echo "$CHANGED" \
                | awk -F/ '$1=="app" && $2=="agents" {print $3}' \
                | sort -u \
                | while read -r name; do \
                    test -n "$name" || continue; \
                    test -d "app/agents/$name" && echo "$name"; \
                  done \
                | jq -R -s -c 'split("\n") | map(select(length > 0))')
              MCPS=$(echo "$CHANGED" \
                | awk -F/ '$1=="app" && $2=="mcp" {print $3}' \
                | sort -u \
                | while read -r name; do \
                    test -n "$name" || continue; \
                    test -d "app/mcp/$name" && echo "$name"; \
                  done \
                | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          fi
          echo "agents=$AGENTS" >> "$GITHUB_OUTPUT"
          echo "mcps=$MCPS"     >> "$GITHUB_OUTPUT"
          echo "Changed agents: $AGENTS"
          echo "Changed mcps:   $MCPS"

  # ------------------------------------------------------------------ build + push agents
  build-agent:
    needs: [test-agent, detect-changes]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect agent Dockerfile
        id: dockerfile
        run: |
          if [ -f "app/agents/${{ matrix.agent }}/Dockerfile" ]; then
            echo "file=app/agents/${{ matrix.agent }}/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=docker/runner/Dockerfile.agent" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
          push: true
          tags: |
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ deploy agents
  deploy-agent:
    needs: [detect-changes, build-agent]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: self-hosted
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate agent directory exists
        run: |
          test -d "app/agents/${{ matrix.agent }}" \
            || { echo "Agent directory app/agents/${{ matrix.agent }} not found"; exit 1; }

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull agent image
        run: docker pull ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest

      - name: Stop existing container (if any)
        run: docker rm -f progenitor-agent-${{ matrix.agent }} 2>/dev/null || true

      - name: Run agent container
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
          GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
          PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL: ${{ secrets.PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL }}
          PROGENITOR_AZURE_STRUCTURED_API_KEY: ${{ secrets.PROGENITOR_AZURE_STRUCTURED_API_KEY }}
          PROGENITOR_AZURE_STRUCTURED_MODEL: ${{ vars.PROGENITOR_AZURE_STRUCTURED_MODEL }}
        run: |
          PORT=8080
          EXTRA_VOLUMES=""
          EXTRA_ENV=""

          if [ "${{ matrix.agent }}" = "observe_agent" ]; then
            DATA_SRC=$(docker inspect progenitor --format \
              '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Source}}{{end}}{{end}}')
            LOGS_SRC=$(docker inspect progenitor --format \
              '{{range .Mounts}}{{if eq .Destination "/app/logs"}}{{.Source}}{{end}}{{end}}')
            EXTRA_VOLUMES="-v ${DATA_SRC}:/app/data:ro -v ${LOGS_SRC}:/app/logs:ro"
          fi

           if [ "${{ matrix.agent }}" = "builder_agent" ]; then
             PORT=8107
             PROMPTS_SRC=$(docker inspect progenitor --format \
               '{{range .Mounts}}{{if eq .Destination "/app/prompts"}}{{.Source}}{{end}}{{end}}')
             docker volume create progenitor-builder-data >/dev/null 2>&1 || true
             docker volume create progenitor-builder-logs >/dev/null 2>&1 || true
             docker volume create progenitor-builder-workspace >/dev/null 2>&1 || true
             # Named volumes are created root-owned; initialize/chown them so the
             # container's non-root "runner" user can write state/logs/worktrees.
             docker run --rm --user 0 \
               -v progenitor-builder-data:/app/data \
               -v progenitor-builder-logs:/app/logs \
               -v progenitor-builder-workspace:/app/workspace \
               ghcr.io/tamaw/progenitor-agent-builder_agent:latest \
               sh -lc "mkdir -p /app/data/state /app/logs/builder_agent /app/workspace && chown -R runner:agent /app/data /app/logs /app/workspace"
             EXTRA_VOLUMES="-v progenitor-builder-data:/app/data -v progenitor-builder-logs:/app/logs -v progenitor-builder-workspace:/app/workspace -v ${PROMPTS_SRC}:/app/prompts:ro"
             EXTRA_ENV="-e GH_TOKEN=${GH_TOKEN} -e PROGENITOR_REPO_URL=https://x-access-token:${GH_TOKEN}@github.com/tamaw/progenitor.git"
           fi

          docker run -d \
            --name progenitor-agent-${{ matrix.agent }} \
            --restart unless-stopped \
            --network langfuse_network \
            -p ${PORT}:${PORT} \
            ${EXTRA_VOLUMES} \
            -e LITELLM_BASE_URL="${LITELLM_BASE_URL}" \
            -e LITELLM_MASTER_KEY="${LITELLM_MASTER_KEY}" \
            -e TEST_MODE=false \
            ${EXTRA_ENV} \
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest

      - name: Wait for agent to become healthy
        run: |
          PORT=8080
          if [ "${{ matrix.agent }}" = "builder_agent" ]; then PORT=8107; fi

          echo "Waiting for agent ${{ matrix.agent }} on port ${PORT}..."
          for i in $(seq 1 30); do
            if docker exec progenitor-agent-${{ matrix.agent }} \
              python -c "import httpx; r = httpx.get('http://localhost:${PORT}/health'); r.raise_for_status()" 2>/dev/null; then
              echo "Agent ${{ matrix.agent }} is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Agent ${{ matrix.agent }} failed health check"
          docker logs progenitor-agent-${{ matrix.agent }} --tail 50
          exit 1

      - name: Update Progenitor agent registry entry
        run: |
          PORT=8080
          if [ "${AGENT_NAME}" = "builder_agent" ]; then PORT=8107; fi
          CODE="import json,os; from datetime import datetime,timezone; from pathlib import Path; name=os.environ['AGENT_NAME']; port=int(os.environ.get('AGENT_PORT','8080')); endpoint=f'http://progenitor-agent-{name}:{port}'; card_url=f'{endpoint}/.well-known/agent.json'; path=Path('/app/data/state/registry.json'); path.parent.mkdir(parents=True, exist_ok=True); data=json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'agents': [], 'tools': []}; agents=list(data.get('agents') or []); now=datetime.now(timezone.utc).isoformat(); existing=next((a for a in agents if a.get('name')==name), {}); created_at=existing.get('created_at', now); enabled=existing.get('enabled', True); entry={**existing, 'name': name, 'kind': 'a2a_agent', 'enabled': enabled, 'created_at': created_at, 'transport': 'http', 'port': port, 'endpoint': endpoint, 'agent_card_url': card_url, 'status': 'running', 'updated_at': now}; data['agents']=[a for a in agents if a.get('name')!=name]+[entry]; path.write_text(json.dumps(data, indent=2, sort_keys=False), encoding='utf-8'); print(f'Updated registry entry for {name} -> {endpoint}')"
          docker exec -e AGENT_NAME="${AGENT_NAME}" -e AGENT_PORT="${PORT}" progenitor python -c "$CODE"
        env:
          AGENT_NAME: ${{ matrix.agent }}

      - name: Register agent with LiteLLM
        continue-on-error: true
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
        run: |
          AGENT_HOST="progenitor-agent-${{ matrix.agent }}"
          AGENT_URL="http://${AGENT_HOST}:8080/v1"
          REGISTER_BASE_URL="${LITELLM_BASE_URL:-http://litellm:4000}"
          if echo "$REGISTER_BASE_URL" | grep -Eq "://(localhost|127\\.0\\.0\\.1)"; then
            REGISTER_BASE_URL="http://litellm:4000"
          fi
          docker run --rm --network langfuse_network curlimages/curl:8.6.0 \
            -fsS -X POST "${REGISTER_BASE_URL}/model/new" \
            -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"model_name\": \"agent/${{ matrix.agent }}\",
              \"litellm_params\": {
                \"model\": \"openai/${{ matrix.agent }}\",
                \"api_base\": \"${AGENT_URL}\",
                \"api_key\": \"${LITELLM_MASTER_KEY}\"
              },
              \"model_info\": {
                \"description\": \"Self-contained agent: ${{ matrix.agent }}\",
                \"id\": \"agent-${{ matrix.agent }}\"
              }
            }"
          echo ""
          echo "Registered agent/${{ matrix.agent }} with LiteLLM at ${AGENT_URL}"

  # ------------------------------------------------------------------ build + push mcps
  build-mcp:
    needs: detect-changes
    if: needs.detect-changes.outputs.mcps != '[]' && needs.detect-changes.outputs.mcps != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.detect-changes.outputs.mcps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runner/Dockerfile.mcp
          build-args: |
            MCP_NAME=${{ matrix.mcp }}
          push: true
          tags: |
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ deploy mcps
  deploy-mcp:
    needs: [detect-changes, build-mcp]
    if: needs.detect-changes.outputs.mcps != '[]' && needs.detect-changes.outputs.mcps != ''
    runs-on: self-hosted
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.detect-changes.outputs.mcps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate MCP directory exists
        run: |
          test -d "app/mcp/${{ matrix.mcp }}" \
            || { echo "MCP directory app/mcp/${{ matrix.mcp }} not found"; exit 1; }

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull MCP image
        run: docker pull ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest

      - name: Stop existing container (if any)
        run: docker rm -f progenitor-mcp-${{ matrix.mcp }} 2>/dev/null || true

      - name: Run MCP container
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
        run: |
          docker run -d \
            --name progenitor-mcp-${{ matrix.mcp }} \
            --restart unless-stopped \
            --network langfuse_network \
            -e LITELLM_BASE_URL="${LITELLM_BASE_URL}" \
            -e LITELLM_MASTER_KEY="${LITELLM_MASTER_KEY}" \
            -e TEST_MODE=false \
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest

      - name: Wait for MCP server to become healthy
        run: |
          echo "Waiting for MCP container to start..."
          for i in $(seq 1 30); do
            if docker exec progenitor-mcp-${{ matrix.mcp }} \
              python -c "import httpx; r = httpx.get('http://localhost:8080/health'); r.raise_for_status()" 2>/dev/null; then
              echo "MCP ${{ matrix.mcp }} is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MCP ${{ matrix.mcp }} failed health check"
          docker logs progenitor-mcp-${{ matrix.mcp }} --tail 50
          exit 1

      - name: Register MCP with LiteLLM
        continue-on-error: true
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
        run: |
          MCP_HOST="progenitor-mcp-${{ matrix.mcp }}"
          MCP_URL="http://${MCP_HOST}:8080/v1"
          REGISTER_BASE_URL="${LITELLM_BASE_URL:-http://litellm:4000}"
          if echo "$REGISTER_BASE_URL" | grep -Eq "://(localhost|127\\.0\\.0\\.1)"; then
            REGISTER_BASE_URL="http://litellm:4000"
          fi
          docker run --rm --network langfuse_network curlimages/curl:8.6.0 \
            -fsS -X POST "${REGISTER_BASE_URL}/model/new" \
            -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"model_name\": \"mcp/${{ matrix.mcp }}\",
              \"litellm_params\": {
                \"model\": \"openai/${{ matrix.mcp }}\",
                \"api_base\": \"${MCP_URL}\",
                \"api_key\": \"${LITELLM_MASTER_KEY}\"
              },
              \"model_info\": {
                \"description\": \"MCP server: ${{ matrix.mcp }}\",
                \"id\": \"mcp-${{ matrix.mcp }}\"
              }
            }"
          echo ""
          echo "Registered mcp/${{ matrix.mcp }} with LiteLLM at ${MCP_URL}"
