name: agents

# Single workflow for agents: test on PRs, build+push+deploy on merge to main.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode: changed (diff HEAD^..HEAD) or all agents"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all
  push:
    paths:
      - "app/agents/**"
      - ".github/workflows/agents.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------ discover
  discover-agents:
    runs-on: self-hosted
    outputs:
      agents: ${{ steps.list.outputs.result }}
    steps:
      - name: Discover agents
        id: list
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const skip = new Set(['__pycache__', '.git', 'base', '.venv', 'node_modules']);
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'app/agents',
              ref: context.sha,
            });
            return JSON.stringify(
              data
                .filter((entry) => entry.type === 'dir' && !entry.name.startsWith('.') && !skip.has(entry.name))
                .map((entry) => entry.name)
                .sort(),
            );

  # ------------------------------------------------------------------ test
  test-agent:
    needs: [discover-agents]
    runs-on: [self-hosted, Linux]
    container:
      image: python:3.12-slim
    env:
      AGENT_NAME: ${{ matrix.agent }}
      PIP_CACHE_DIR: /tmp/pip-cache
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover-agents.outputs.agents) }}
    steps:
      - name: Normalize workspace ownership
        run: |
          WORKSPACE_OWNER="$(stat -c '%u:%g' "$(dirname "$GITHUB_WORKSPACE")")"
          mkdir -p "$GITHUB_WORKSPACE"
          chown -R "$WORKSPACE_OWNER" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libatomic1

      - name: Install Python deps
        run: |
          mkdir -p "$PIP_CACHE_DIR"
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ -f "app/agents/${{ matrix.agent }}/requirements.txt" ]; then
            pip install -r "app/agents/${{ matrix.agent }}/requirements.txt"
          fi

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          TARGETS="app/agents/${{ matrix.agent }}"
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          [ -d "$TEST_DIR" ] && TARGETS="$TARGETS $TEST_DIR"
          ruff check $TARGETS

      - name: Type-check (pyright)
        run: |
          . .venv/bin/activate
          pyright "app/agents/${{ matrix.agent }}"

      - name: Tests (pytest)
        run: |
          . .venv/bin/activate
          TEST_DIR="tests/agents/${{ matrix.agent }}"
          if [ -d "$TEST_DIR" ]; then
            pytest "$TEST_DIR" -q
          else
            echo "No tests found for ${{ matrix.agent }}, skipping."
          fi

      - name: Restore workspace ownership
        if: ${{ always() }}
        run: |
          WORKSPACE_OWNER="$(stat -c '%u:%g' "$(dirname "$GITHUB_WORKSPACE")")"
          chown -R "$WORKSPACE_OWNER" "$GITHUB_WORKSPACE"

  # ------------------------------------------------------------------ detect changes (main/dispatch only)
  detect-changes:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux]
    outputs:
      agents: ${{ steps.collect.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main for workflow dispatch diff
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Resolve main base SHA
        id: base-sha
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        run: echo "sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"

      - name: List all agents
        id: list-all
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'all'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const skip = new Set(['__pycache__', '.git', 'base', '.venv', 'node_modules']);
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'app/agents',
              ref: context.sha,
            });
            return JSON.stringify(
              data
                .filter((entry) => entry.type === 'dir' && !entry.name.startsWith('.') && !skip.has(entry.name))
                .map((entry) => entry.name)
                .sort(),
            );

      - name: Detect changed agent files (push)
        id: changed-push
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@v46
        with:
          json: true
          files: |
            app/agents/**

      - name: Detect changed agent files (dispatch)
        id: changed-dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'all'
        uses: tj-actions/changed-files@v46
        with:
          json: true
          files: |
            app/agents/**
          base_sha: ${{ steps.base-sha.outputs.sha }}
          sha: ${{ github.sha }}

      - name: Build changed agent matrix
        id: changed-agents
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'all'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed-push.outputs.all_changed_files || steps.changed-dispatch.outputs.all_changed_files }}
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = path.join(process.env.GITHUB_WORKSPACE, 'app', 'agents');
            const changedFiles = JSON.parse(process.env.CHANGED_FILES || '[]');
            const agents = [...new Set(
              changedFiles
                .filter((file) => file.startsWith('app/agents/'))
                .map((file) => file.split('/')[2])
                .filter((name) => name && fs.existsSync(path.join(root, name)) && fs.statSync(path.join(root, name)).isDirectory()),
            )].sort();
            return JSON.stringify(agents);

      - name: Finalize agent output
        id: collect
        uses: actions/github-script@v7
        env:
          ALL_AGENTS: ${{ steps.list-all.outputs.result }}
          CHANGED_AGENTS: ${{ steps.changed-agents.outputs.result }}
        with:
          result-encoding: string
          script: |
            return process.env.ALL_AGENTS || process.env.CHANGED_AGENTS || '[]';

  # ------------------------------------------------------------------ build + push agents
  build-agent:
    needs: [test-agent, detect-changes]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/agents/${{ matrix.agent }}/Dockerfile
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=agent
          tags: |
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ deploy agents
  deploy-agent:
    needs: [detect-changes, build-agent]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: [self-hosted, Linux, python]
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate agent directory exists
        run: |
          test -d "app/agents/${{ matrix.agent }}" \
            || { echo "Agent directory app/agents/${{ matrix.agent }} not found"; exit 1; }
          test -f "app/agents/${{ matrix.agent }}/Dockerfile" \
            || { echo "Dockerfile app/agents/${{ matrix.agent }}/Dockerfile not found"; exit 1; }
          test -f "app/agents/${{ matrix.agent }}/agent.yml" \
            || { echo "Runtime manifest app/agents/${{ matrix.agent }}/agent.yml not found"; exit 1; }

      - name: Read agent runtime port
        id: runtime-port
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq -r '.runtime.port' "app/agents/${{ matrix.agent }}/agent.yml"

      - name: Read agent runtime mounts
        id: runtime-mounts
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq -r '.runtime.mounts[] | "\(.host_path):\(.container_path)"' "app/agents/${{ matrix.agent }}/agent.yml"

      - name: Read agent runtime env keys
        id: runtime-env
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq -r '.runtime.env_keys[]' "app/agents/${{ matrix.agent }}/agent.yml"

      - name: Ensure external network
        run: docker network inspect progenitor_network >/dev/null 2>&1 || docker network create progenitor_network

      - name: Validate agent manifest
        env:
          PORT: ${{ steps.runtime-port.outputs.result }}
          MOUNTS: ${{ steps.runtime-mounts.outputs.result }}
          ENV_KEYS: ${{ steps.runtime-env.outputs.result }}
        shell: bash
        run: |
          [[ "$PORT" =~ ^[0-9]+$ ]] || { echo "Invalid manifest port: $PORT"; exit 1; }
          [ -n "$MOUNTS" ] || { echo "No mounts declared in agent manifest"; exit 1; }
          [ -n "$ENV_KEYS" ] || { echo "No env_keys declared in agent manifest"; exit 1; }

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull agent image
        run: docker pull ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest

      - name: Stop existing container (if any)
        env:
          AGENT_NAME: ${{ matrix.agent }}
        run: docker rm -f progenitor-agent-${AGENT_NAME} 2>/dev/null || true

      - name: Run agent container
        env:
          AGENT_NAME: ${{ matrix.agent }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AGENT_MODEL_DEFAULT: ${{ vars.AGENT_MODEL_DEFAULT }}
          OVERRIDE_AGENT_PLANNER_MODEL: ${{ vars.OVERRIDE_AGENT_PLANNER_MODEL }}
          OVERRIDE_AGENT_BUILDER_MODEL: ${{ vars.OVERRIDE_AGENT_BUILDER_MODEL }}
          DEFAULT_COPILOT_MODEL: ${{ vars.DEFAULT_COPILOT_MODEL }}
          PROGENITOR_MODEL_DEFAULT: ${{ vars.PROGENITOR_MODEL_DEFAULT }}
          PROGENITOR_COPILOT_ADDITIONAL_FLAGS: ${{ vars.PROGENITOR_COPILOT_ADDITIONAL_FLAGS }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          PROGENITOR_REPO_URL: https://github.com/tamaw/progenitor.git
          RUNTIME_MOUNTS: ${{ steps.runtime-mounts.outputs.result }}
          RUNTIME_ENV_KEYS: ${{ steps.runtime-env.outputs.result }}
        shell: bash
        run: |
          CONTAINER_NAME="progenitor-agent-${AGENT_NAME}"
          DOCKER_ARGS=(
            -d
            --name "$CONTAINER_NAME"
            --restart unless-stopped
            --network progenitor_network
            --user 0:0
            --tmpfs /app/tmp:rw,noexec,nosuid,size=512m
            -e "AGENT_NAME=${AGENT_NAME}"
            -e "A2A_PUBLIC_HOST=${CONTAINER_NAME}"
            -e "PROGENITOR_DATA_DIR=/app/data"
            -e "PROGENITOR_STATE_DIR=/app/data/state"
            -e "PROGENITOR_PROMPTS_DIR=/app/data/prompts"
            -e "PROGENITOR_LOG_DIR=/app/logs"
            -e "PROGENITOR_PROJECT_ROOT=/app/worktrees"
            -e "PROGENITOR_WORKTREE_DIR=/app/worktrees/worktrees"
            -e "PROGENITOR_WORKTREES_ROOT=/app/worktrees"
          )

          while IFS= read -r mount_spec; do
            [ -n "$mount_spec" ] || continue
            DOCKER_ARGS+=( -v "$mount_spec" )
          done <<< "$RUNTIME_MOUNTS"

          while IFS= read -r env_key; do
            [ -n "$env_key" ] || continue
            DOCKER_ARGS+=( -e "$env_key" )
          done <<< "$RUNTIME_ENV_KEYS"

          docker run "${DOCKER_ARGS[@]}" "ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest"

      - name: Wait for agent to become healthy
        id: health
        env:
          AGENT_NAME: ${{ matrix.agent }}
        shell: bash
        run: |
          CONTAINER_NAME="progenitor-agent-${AGENT_NAME}"
          echo "registry_host=${CONTAINER_NAME}" >> "$GITHUB_OUTPUT"

          wait_healthy() {
            local name="$1"
            local attempts="${2:-30}"
            local i status
            for i in $(seq 1 "$attempts"); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "$name is healthy"
                return 0
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              sleep 2
            done
            echo "Timed out waiting for $name to become healthy (status=$status)"
            docker logs "$name" --tail 50 || true
            return 1
          }

          echo "Waiting for agent ${{ matrix.agent }} to become healthy..."
          if ! wait_healthy "${CONTAINER_NAME}" 30; then
            echo "Agent ${{ matrix.agent }} failed health check"
            exit 1
          fi

      - name: Register agent in progenitor registry
        if: success()
        env:
          AGENT_NAME: ${{ matrix.agent }}
          PORT: ${{ steps.runtime-port.outputs.result }}
          DOCKER_HOSTNAME: ${{ steps.health.outputs.registry_host }}
          PROGENITOR_CONTAINER: progenitor
        run: python .github/scripts/register_agent.py

      - name: Cleanup unused managed images
        if: success()
        run: |
          docker image prune -af \
            --filter "label=com.progenitor.managed=true" \
            --filter "until=168h" || true
