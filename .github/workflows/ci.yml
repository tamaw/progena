name: ci

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'app/agents/**'
      - 'app/mcp/**'
      - '.github/workflows/agents.yml'
      - '.github/workflows/mcp.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main we want deploys to queue (not cancel) so merges can stack safely.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  runner-context:
    runs-on: self-hosted
    outputs:
      uid: ${{ steps.ids.outputs.uid }}
      gid: ${{ steps.ids.outputs.gid }}
    steps:
      - name: Capture runner uid/gid
        id: ids
        run: |
          RUN_UID="$(id -u)"
          RUN_GID="$(id -g)"
          echo "uid=${RUN_UID}" >> "$GITHUB_OUTPUT"
          echo "gid=${RUN_GID}" >> "$GITHUB_OUTPUT"

  backend:
    needs: runner-context
    runs-on: [self-hosted, Linux]
    container:
      image: python:3.12-slim
      options: --user ${{ needs.runner-context.outputs.uid }}:${{ needs.runner-context.outputs.gid }}
    env:
      PIP_CACHE_DIR: /tmp/pip-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          mkdir -p "$PIP_CACHE_DIR"
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint backend (ruff)
        continue-on-error: true
        run: |
          . .venv/bin/activate
          ruff check app/backend tests/backend

      - name: Tests backend (pytest)
        run: |
          . .venv/bin/activate
          pytest tests/backend

  progenitor:
    needs: runner-context
    runs-on: [self-hosted, Linux]
    container:
      image: python:3.12-slim
      options: --user ${{ needs.runner-context.outputs.uid }}:${{ needs.runner-context.outputs.gid }}
    env:
      PIP_CACHE_DIR: /tmp/pip-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          mkdir -p "$PIP_CACHE_DIR"
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint progenitor (ruff)
        run: |
          . .venv/bin/activate
          ruff check app/progenitor tests/progenitor tests/test_scheduler.py

      - name: Type-check progenitor (pyright)
        run: |
          . .venv/bin/activate
          pyright app/progenitor

      - name: Tests progenitor (pytest)
        run: >
          . .venv/bin/activate &&
          pytest
          tests/progenitor
          tests/test_scheduler.py
          --ignore=tests/progenitor/test_dual_loop_full_integration.py
          --ignore=tests/progenitor/test_dual_loop_integration.py
          --ignore=tests/progenitor/test_e2e_dual_loop.py

  frontend:
    needs: runner-context
    runs-on: self-hosted
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  build-and-push:
    runs-on: self-hosted
    needs: [backend, progenitor, frontend]
    # Keep push-based image publishing on main, but allow explicit manual dispatches from a branch.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push progenitor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/progenitor/Dockerfile
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=progenitor
          tags: |
            ghcr.io/tamaw/progenitor:latest
            ghcr.io/tamaw/progenitor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=backend
          tags: |
            ghcr.io/tamaw/progenitor-backend:latest
            ghcr.io/tamaw/progenitor-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          file: docker/frontend/Dockerfile
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=frontend
          tags: |
            ghcr.io/tamaw/progenitor-frontend:latest
            ghcr.io/tamaw/progenitor-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Deploy + liveness check on the cronix self-hosted runner after CI succeeds.
    runs-on: self-hosted
    environment: cronix
    needs: [build-and-push]
    # Keep push-based deploys on main, but allow explicit manual dispatches from a branch.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure external network
        run: docker network inspect progenitor_network >/dev/null 2>&1 || docker network create progenitor_network

      - name: Deploy progenitor stack
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          PROGENITOR_MODEL_DEFAULT: ${{ vars.PROGENITOR_MODEL_DEFAULT }}
          PROGENITOR_TIMEZONE: ${{ vars.PROGENITOR_TIMEZONE }}
          GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
          PROGENITOR_REASONING_ENABLED: ${{ vars.PROGENITOR_REASONING_ENABLED }}
          PROGENITOR_REASONING_BUDGET_TOKENS: ${{ vars.PROGENITOR_REASONING_BUDGET_TOKENS }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED }}
          TELEGRAM_POLLING_ENABLED: ${{ vars.TELEGRAM_POLLING_ENABLED }}
          TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROGENITOR_HOST_DATA_DIR: /var/lib/progenitor/data
          PROGENITOR_HOST_LOGS_DIR: /var/lib/progenitor/logs
          PROGENITOR_HOST_WORKTREES_DIR: /var/lib/progenitor/worktrees
          PROGENITOR_HOST_TMP_DIR: /var/lib/progenitor/tmp
        run: |
          PROMPTS_HOST_DIR="${PROGENITOR_HOST_DATA_DIR}/prompts"
          SKILLS_HOST_DIR="${PROGENITOR_HOST_DATA_DIR}/skills"
          ASSET_SYNC_CONTAINER="progenitor-asset-sync"
          # If a manual/dev container exists with the same name, docker compose will fail.
          # Removing containers keeps bind-mounted state (data/logs/worktrees) intact.
          docker rm -f progenitor progenitor-backend progenitor-frontend "${ASSET_SYNC_CONTAINER}" 2>/dev/null || true
          # The self-hosted runner runs in Docker, so writing /var/lib/... from the job filesystem does
          # not populate the Docker host bind mounts used by the deployed containers. Sync prompt assets
          # through a helper container that mounts the real host data/log paths seen by the daemon.
          docker create --name "${ASSET_SYNC_CONTAINER}" \
            -v "${PROGENITOR_HOST_DATA_DIR}:/app/data" \
            -v "${PROGENITOR_HOST_LOGS_DIR}:/app/logs" \
            alpine:3.20 \
            sh -c 'mkdir -p /app/data/prompts /app/data/skills /app/logs && tail -f /dev/null' >/dev/null
          docker start "${ASSET_SYNC_CONTAINER}" >/dev/null
          docker exec "${ASSET_SYNC_CONTAINER}" sh -c \
            'find /app/data/prompts -mindepth 1 -maxdepth 1 -exec rm -rf {} + && \
             find /app/data/skills -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          docker cp data/prompts/. "${ASSET_SYNC_CONTAINER}:/app/data/prompts/"
          docker cp data/skills/. "${ASSET_SYNC_CONTAINER}:/app/data/skills/"
          docker rm -f "${ASSET_SYNC_CONTAINER}" >/dev/null
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose -f docker/docker-compose.progenitor.yml pull
          docker compose -f docker/docker-compose.progenitor.yml up -d
          docker compose -f docker/docker-compose.progenitor.yml ps

      - name: Liveness checks
        run: |
          wait_healthy() {
            local name="$1"
            local attempts="${2:-60}"
            local i status
            for i in $(seq 1 "$attempts"); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "$name is healthy"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name to become healthy (status=$status)"
            docker ps -a || true
            docker logs "$name" --tail 200 || true
            return 1
          }

          wait_healthy progenitor-backend 90
          wait_healthy progenitor 120
          wait_healthy progenitor-frontend 60

      - name: Cleanup unused managed images
        if: success()
        run: |
          docker image prune -af \
            --filter "label=com.progenitor.managed=true" \
            --filter "until=168h" || true
