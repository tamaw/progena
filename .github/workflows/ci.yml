name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
          pip install -e .

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .

      - name: Tests (pytest)
        run: >
          pytest
          --ignore=tests/progenitor/test_dual_loop_full_integration.py
          --ignore=tests/progenitor/test_dual_loop_integration.py
          --ignore=tests/progenitor/test_e2e_dual_loop.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build progenitor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/progenitor/Dockerfile
          push: false
          tags: progenitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          tags: progenitor-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          file: docker/frontend/Dockerfile
          push: false
          tags: progenitor-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

