name: ci

on:
  workflow_dispatch:
    # Manual runs are used as an explicit deploy signal; build-and-deploy
    # still runs after validation even when no push-based diff is available.
  push:
    paths-ignore:
      - 'app/agents/**'
      - 'app/mcp/**'
      - '.github/workflows/agents.yml'
      - '.github/workflows/mcp.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main we want deploys to queue (not cancel) so merges can stack safely.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: [self-hosted, Linux, python]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint backend (ruff)
        run: |
          . .venv/bin/activate
          ruff check app/backend tests/backend

      - name: Tests backend (pytest)
        run: |
          . .venv/bin/activate
          pytest tests/backend

  progenitor:
    # Pyright uses a system Node runtime on the self-hosted runner.
    runs-on: [self-hosted, Linux, node, python]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint progenitor (ruff)
        run: |
          . .venv/bin/activate
          ruff check app/progenitor tests/progenitor tests/test_scheduler.py

      - name: Type-check progenitor (pyright)
        run: |
          . .venv/bin/activate
          pyright app/progenitor

      - name: Tests progenitor (pytest)
        run: >
          . .venv/bin/activate &&
          pytest
          tests/progenitor
          tests/test_scheduler.py

  frontend:
    runs-on: [self-hosted, Linux, node]
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install deps
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-and-deploy:
    runs-on: [self-hosted, Linux, docker]
    environment: cronix
    needs: [backend, progenitor, frontend]
    # Build deployment images and deploy them on the same self-hosted Docker runner.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - name: Detect deploy-affecting changes
        id: changes
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            progenitor_image:
              - 'app/progenitor/**'
              - 'docker/progenitor/**'
              - 'pyproject.toml'
            backend_image:
              - 'app/backend/**'
              - 'docker/backend/**'
              - 'pyproject.toml'
            frontend_image:
              - 'app/frontend/**'
              - 'docker/frontend/**'
            redeploy:
              - 'app/backend/**'
              - 'app/progenitor/**'
              - 'app/frontend/**'
              - 'docker/**'
              - 'pyproject.toml'
              - 'data/prompts/**'
              - 'data/skills/**'

      - uses: docker/setup-buildx-action@v3

      - name: Build and load progenitor image
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.progenitor_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/progenitor/Dockerfile
          load: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=progenitor
          tags: |
            ghcr.io/tamaw/progenitor:latest
            ghcr.io/tamaw/progenitor:${{ github.sha }}
          cache-from: type=gha,scope=progenitor-image
          cache-to: type=gha,mode=max,scope=progenitor-image

      - name: Build and load backend image
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.backend_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          load: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=backend
          tags: |
            ghcr.io/tamaw/progenitor-backend:latest
            ghcr.io/tamaw/progenitor-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Build and load frontend image
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.frontend_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          file: docker/frontend/Dockerfile
          load: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=frontend
          tags: |
            ghcr.io/tamaw/progenitor-frontend:latest
            ghcr.io/tamaw/progenitor-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

      - name: No deploy-affecting changes
        if: ${{ github.event_name != 'workflow_dispatch' && steps.changes.outputs.redeploy != 'true' }}
        run: echo "No deploy-affecting changes detected; skipping image rebuilds and compose restart."

      - name: Ensure external network
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.redeploy == 'true' }}
        run: docker network inspect progenitor_network >/dev/null 2>&1 || docker network create progenitor_network

      - name: Deploy progenitor stack
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.redeploy == 'true' }}
        env:
          PROGENITOR_IMAGE_TAG: latest
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          PROGENITOR_MODEL_DEFAULT: ${{ vars.PROGENITOR_MODEL_DEFAULT }}
          PROGENITOR_TIMEZONE: ${{ vars.PROGENITOR_TIMEZONE }}
          PROGENITOR_REASONING_ENABLED: ${{ vars.PROGENITOR_REASONING_ENABLED }}
          PROGENITOR_REASONING_EFFORT: ${{ vars.PROGENITOR_REASONING_EFFORT }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED }}
          TELEGRAM_POLLING_ENABLED: ${{ vars.TELEGRAM_POLLING_ENABLED }}
          TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROGENITOR_HOST_DATA_DIR: /var/lib/progenitor/data
          PROGENITOR_HOST_PROMPTS_DIR: ${{ github.workspace }}/data/prompts
          PROGENITOR_HOST_SKILLS_DIR: ${{ github.workspace }}/data/skills
          PROGENITOR_HOST_LOGS_DIR: /var/lib/progenitor/logs
        run: |
          # If a manual/dev container exists with the same name, docker compose will fail.
          # Removing containers keeps bind-mounted state (data/logs/worktrees) intact.
          docker rm -f progenitor progenitor-backend progenitor-frontend 2>/dev/null || true
          docker volume inspect progenitor-postgres-data >/dev/null 2>&1 || docker volume create progenitor-postgres-data >/dev/null
          docker image inspect ghcr.io/tamaw/progenitor:${PROGENITOR_IMAGE_TAG} >/dev/null
          docker image inspect ghcr.io/tamaw/progenitor-backend:${PROGENITOR_IMAGE_TAG} >/dev/null
          docker image inspect ghcr.io/tamaw/progenitor-frontend:${PROGENITOR_IMAGE_TAG} >/dev/null
          test -d "$PROGENITOR_HOST_PROMPTS_DIR"
          test -d "$PROGENITOR_HOST_SKILLS_DIR"
          docker compose -f docker/docker-compose.progenitor.yml up -d --no-build --pull never
          docker compose -f docker/docker-compose.progenitor.yml ps

      - name: Liveness checks
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.redeploy == 'true' }}
        run: |
          wait_healthy() {
            local name="$1"
            local attempts="${2:-60}"
            local i status
            for i in $(seq 1 "$attempts"); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "$name is healthy"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name to become healthy (status=$status)"
            docker ps -a || true
            docker logs "$name" --tail 200 || true
            return 1
          }

          wait_healthy progenitor-postgres 60
          wait_healthy progenitor-backend 90
          wait_healthy progenitor 120
          wait_healthy progenitor-frontend 60
