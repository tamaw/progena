name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-smoke:
    # Safe diagnostic: verifies GitHub is providing secrets (length only) on a hosted runner.
    runs-on: ubuntu-latest
    steps:
      - name: Print secret lengths (hosted)
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          AZURE_RESPONSES_API_KEY: ${{ secrets.AZURE_RESPONSES_API_KEY }}
          PROGENITOR_MCP_API_KEY: ${{ secrets.PROGENITOR_MCP_API_KEY }}
        run: |
          echo "hosted_LITELLM_MASTER_KEY_len=${#LITELLM_MASTER_KEY}"
          echo "hosted_AZURE_RESPONSES_API_KEY_len=${#AZURE_RESPONSES_API_KEY}"
          echo "hosted_PROGENITOR_MCP_API_KEY_len=${#PROGENITOR_MCP_API_KEY}"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
          pip install -e .

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .

      - name: Tests (pytest)
        run: >
          pytest
          --ignore=tests/progenitor/test_dual_loop_full_integration.py
          --ignore=tests/progenitor/test_dual_loop_integration.py
          --ignore=tests/progenitor/test_e2e_dual_loop.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build progenitor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/progenitor/Dockerfile
          push: false
          tags: progenitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cronix:
    # Deploy + liveness check on the cronix self-hosted runner after CI succeeds.
    runs-on: [self-hosted, Linux, X64]
    needs: [python, frontend]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          PROGENITOR_MCP_API_KEY: ${{ secrets.PROGENITOR_MCP_API_KEY }}
          PROGENITOR_AZURE_STRUCTURED_API_KEY: ${{ secrets.PROGENITOR_AZURE_STRUCTURED_API_KEY }}
          PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL: ${{ secrets.PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL }}
        run: |
          echo "LITELLM_MASTER_KEY_len=${#LITELLM_MASTER_KEY}"
          echo "PROGENITOR_MCP_API_KEY_len=${#PROGENITOR_MCP_API_KEY}"
          echo "PROGENITOR_AZURE_STRUCTURED_API_KEY_len=${#PROGENITOR_AZURE_STRUCTURED_API_KEY}"
          echo "PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL_len=${#PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL}"
          test -n "$LITELLM_MASTER_KEY" || (echo "Missing/empty secret: LITELLM_MASTER_KEY" && exit 1)

      - name: Write env file
        run: |
          cat > .progenitor.env <<EOF
          LITELLM_MASTER_KEY=${{ secrets.LITELLM_MASTER_KEY }}
          EOF
          if [ -n "${{ secrets.LITELLM_BASE_URL }}" ]; then echo "LITELLM_BASE_URL=${{ secrets.LITELLM_BASE_URL }}" >> .progenitor.env; fi
          if [ -n "${{ secrets.PROGENITOR_MODEL_DEFAULT }}" ]; then echo "PROGENITOR_MODEL_DEFAULT=${{ secrets.PROGENITOR_MODEL_DEFAULT }}" >> .progenitor.env; fi
          if [ -n "${{ secrets.PROGENITOR_TIMEZONE }}" ]; then echo "PROGENITOR_TIMEZONE=${{ secrets.PROGENITOR_TIMEZONE }}" >> .progenitor.env; fi

      - name: Ensure external network
        run: docker network inspect langfuse_network >/dev/null 2>&1 || docker network create langfuse_network

      - name: Deploy progenitor stack
        run: |
          docker compose --env-file .progenitor.env -f docker/docker-compose.progenitor.yml up -d --build
          docker compose -f docker/docker-compose.progenitor.yml ps

      - name: Liveness checks
        run: |
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          docker exec progenitor python /app/scripts/healthcheck.py

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          tags: progenitor-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          file: docker/frontend/Dockerfile
          push: false
          tags: progenitor-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

