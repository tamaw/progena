name: ci

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'app/agents/**'
      - 'app/mcp/**'
      - '.github/workflows/agents.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main we want deploys to queue (not cancel) so merges can stack safely.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  runner-context:
    runs-on: self-hosted
    outputs:
      uid: ${{ steps.ids.outputs.uid }}
      gid: ${{ steps.ids.outputs.gid }}
    steps:
      - name: Capture runner uid/gid
        id: ids
        run: |
          RUN_UID="$(id -u)"
          RUN_GID="$(id -g)"
          echo "uid=${RUN_UID}" >> "$GITHUB_OUTPUT"
          echo "gid=${RUN_GID}" >> "$GITHUB_OUTPUT"

  backend:
    needs: runner-context
    runs-on: [self-hosted, Linux]
    container:
      image: python:3.12-slim
      options: --user ${{ needs.runner-context.outputs.uid }}:${{ needs.runner-context.outputs.gid }}
      volumes:
        - /var/cache/gh-pip:/github/home/.cache/pip
    env:
      PIP_CACHE_DIR: /github/home/.cache/pip
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install ruff
          pip install -e . --no-deps

      - name: Lint backend (ruff)
        continue-on-error: true
        run: |
          . .venv/bin/activate
          ruff check app/backend tests/backend

      - name: Tests backend (pytest)
        run: |
          . .venv/bin/activate
          pytest tests/backend

  progenitor:
    needs: runner-context
    runs-on: [self-hosted, Linux]
    container:
      image: python:3.12-slim
      options: --user ${{ needs.runner-context.outputs.uid }}:${{ needs.runner-context.outputs.gid }}
      volumes:
        - /var/cache/gh-pip:/github/home/.cache/pip
    env:
      PIP_CACHE_DIR: /github/home/.cache/pip
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install ruff pyright
          pip install -e . --no-deps

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint progenitor (ruff)
        run: |
          . .venv/bin/activate
          ruff check app/progenitor tests/progenitor tests/test_scheduler.py

      - name: Type-check progenitor (pyright)
        run: |
          . .venv/bin/activate
          pyright app/progenitor

      - name: Tests progenitor (pytest)
        run: >
          . .venv/bin/activate &&
          pytest
          tests/progenitor
          tests/test_scheduler.py
          --ignore=tests/progenitor/test_dual_loop_full_integration.py
          --ignore=tests/progenitor/test_dual_loop_integration.py
          --ignore=tests/progenitor/test_e2e_dual_loop.py

  frontend:
    needs: runner-context
    runs-on: self-hosted
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  build-and-push:
    runs-on: self-hosted
    needs: [backend, progenitor, frontend]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push progenitor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/progenitor/Dockerfile
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=progenitor
          tags: |
            ghcr.io/tamaw/progenitor:latest
            ghcr.io/tamaw/progenitor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=backend
          tags: |
            ghcr.io/tamaw/progenitor-backend:latest
            ghcr.io/tamaw/progenitor-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          file: docker/frontend/Dockerfile
          push: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=frontend
          tags: |
            ghcr.io/tamaw/progenitor-frontend:latest
            ghcr.io/tamaw/progenitor-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Deploy + liveness check on the cronix self-hosted runner after CI succeeds.
    runs-on: self-hosted
    environment: cronix
    needs: [build-and-push]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure external network
        run: docker network inspect progenitor_network >/dev/null 2>&1 || docker network create progenitor_network

      - name: Deploy progenitor stack
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          PROGENITOR_MODEL_DEFAULT: ${{ secrets.PROGENITOR_MODEL_DEFAULT }}
          PROGENITOR_TIMEZONE: ${{ secrets.PROGENITOR_TIMEZONE }}
          GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
          PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL: ${{ secrets.PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL }}
          PROGENITOR_AZURE_STRUCTURED_API_KEY: ${{ secrets.PROGENITOR_AZURE_STRUCTURED_API_KEY }}
          PROGENITOR_AZURE_STRUCTURED_MODEL: ${{ vars.PROGENITOR_AZURE_STRUCTURED_MODEL }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED }}
          TELEGRAM_POLLING_ENABLED: ${{ vars.TELEGRAM_POLLING_ENABLED }}
          TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROGENITOR_HOST_DATA_DIR: /var/lib/progenitor/data
          PROGENITOR_HOST_LOGS_DIR: /var/lib/progenitor/logs
          PROGENITOR_HOST_WORKTREES_DIR: /var/lib/progenitor/worktrees
          PROGENITOR_HOST_TMP_DIR: /var/lib/progenitor/tmp
          PROGENITOR_HOST_PROMPTS_DIR: /var/lib/progenitor/prompts
        run: |
          # If a manual/dev container exists with the same name, docker compose will fail.
          # Removing containers keeps bind-mounted state (data/logs/worktrees) intact.
          docker rm -f progenitor progenitor-backend 2>/dev/null || true
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p \
              "${PROGENITOR_HOST_DATA_DIR}" \
              "${PROGENITOR_HOST_LOGS_DIR}" \
              "${PROGENITOR_HOST_WORKTREES_DIR}" \
              "${PROGENITOR_HOST_TMP_DIR}" \
              "${PROGENITOR_HOST_PROMPTS_DIR}"
            sudo chown -R "$(id -u):$(id -g)" /var/lib/progenitor || true
          else
            mkdir -p \
              "${PROGENITOR_HOST_DATA_DIR}" \
              "${PROGENITOR_HOST_LOGS_DIR}" \
              "${PROGENITOR_HOST_WORKTREES_DIR}" \
              "${PROGENITOR_HOST_TMP_DIR}" \
              "${PROGENITOR_HOST_PROMPTS_DIR}"
            chown -R "$(id -u):$(id -g)" /var/lib/progenitor || true
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose -f docker/docker-compose.progenitor.yml pull
          docker compose -f docker/docker-compose.progenitor.yml up -d
          docker compose -f docker/docker-compose.progenitor.yml ps

      - name: Liveness checks
        run: |
          wait_healthy() {
            local name="$1"
            local attempts="${2:-60}"
            local i status
            for i in $(seq 1 "$attempts"); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "$name is healthy"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name to become healthy (status=$status)"
            docker ps -a || true
            docker logs "$name" --tail 200 || true
            return 1
          }

          wait_healthy progenitor-backend 90
          wait_healthy progenitor 120

      - name: Cleanup unused managed images
        if: success()
        run: |
          docker image prune -af \
            --filter "label=com.progenitor.managed=true" \
            --filter "until=168h" || true
