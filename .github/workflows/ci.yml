name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
          pip install -e .

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .

      - name: Tests (pytest)
        run: >
          pytest
          --ignore=tests/progenitor/test_dual_loop_full_integration.py
          --ignore=tests/progenitor/test_dual_loop_integration.py
          --ignore=tests/progenitor/test_e2e_dual_loop.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build progenitor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/progenitor/Dockerfile
          push: false
          tags: progenitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cronix:
    # Deploy + liveness check on the cronix self-hosted runner after CI succeeds.
    runs-on: [self-hosted, Linux, X64]
    environment: cronix
    needs: [python, frontend]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          # Allow values to come from Environment secrets/vars (cronix) or repo-level secrets.
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY || vars.LITELLM_API_KEY }}
        run: |
          test -n "$LITELLM_MASTER_KEY" || (echo "Missing/empty secret: LITELLM_MASTER_KEY" && exit 1)
          test -n "$LITELLM_API_KEY" || (echo "Missing/empty secret: LITELLM_API_KEY" && exit 1)

      - name: Write env file
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY || vars.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          PROGENITOR_MODEL_DEFAULT: ${{ secrets.PROGENITOR_MODEL_DEFAULT || vars.PROGENITOR_MODEL_DEFAULT }}
          PROGENITOR_TIMEZONE: ${{ secrets.PROGENITOR_TIMEZONE || vars.PROGENITOR_TIMEZONE }}
        run: |
          cat > .progenitor.env <<EOF
          LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
          EOF
          if [ -n "${LITELLM_API_KEY}" ]; then echo "LITELLM_API_KEY=${LITELLM_API_KEY}" >> .progenitor.env; fi
          if [ -n "${LITELLM_BASE_URL}" ]; then echo "LITELLM_BASE_URL=${LITELLM_BASE_URL}" >> .progenitor.env; fi
          if [ -n "${PROGENITOR_MODEL_DEFAULT}" ]; then echo "PROGENITOR_MODEL_DEFAULT=${PROGENITOR_MODEL_DEFAULT}" >> .progenitor.env; fi
          if [ -n "${PROGENITOR_TIMEZONE}" ]; then echo "PROGENITOR_TIMEZONE=${PROGENITOR_TIMEZONE}" >> .progenitor.env; fi

      - name: Ensure external network
        run: docker network inspect langfuse_network >/dev/null 2>&1 || docker network create langfuse_network

      - name: Deploy progenitor stack
        run: |
          docker compose --env-file .progenitor.env -f docker/docker-compose.progenitor.yml up -d --build
          docker compose -f docker/docker-compose.progenitor.yml ps

      - name: Liveness checks
        run: |
          wait_healthy() {
            local name="$1"
            local attempts="${2:-60}"
            local i status
            for i in $(seq 1 "$attempts"); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "$name is healthy"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name to become healthy (status=$status)"
            docker ps -a || true
            docker logs "$name" --tail 200 || true
            return 1
          }

          wait_healthy progenitor-backend 90
          wait_healthy progenitor 120

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          tags: progenitor-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          file: docker/frontend/Dockerfile
          push: false
          tags: progenitor-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
