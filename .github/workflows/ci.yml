name: ci

on:
  workflow_dispatch:
    # Manual runs are used as an explicit deploy signal; build-and-deploy
    # still runs after validation even when no push-based diff is available.
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main we want deploys to queue (not cancel) so merges can stack safely.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: [self-hosted, Linux, python]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint backend (ruff)
        run: |
          . .venv/bin/activate
          ruff check app/backend tests/backend

      - name: Tests backend (pytest)
        run: |
          . .venv/bin/activate
          pytest tests/backend

  progenitor:
    # Pyright uses a system Node runtime on the self-hosted runner.
    runs-on: [self-hosted, Linux, node, python]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint progenitor (ruff)
        run: |
          . .venv/bin/activate
          ruff check app/progenitor tests/progenitor tests/test_scheduler.py

      - name: Type-check (pyright)
        # --pythonpath keeps this identical to the pre-commit hook, so the
        # interpreter never depends on activation state.
        run: |
          . .venv/bin/activate
          pyright --pythonpath .venv/bin/python app/

      - name: Tests progenitor (pytest)
        run: >
          . .venv/bin/activate &&
          pytest
          tests/progenitor
          tests/test_scheduler.py

  frontend:
    runs-on: [self-hosted, Linux, node]
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install deps
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  build-and-deploy:
    runs-on: [self-hosted, Linux, docker]
    environment: production
    needs: [backend, progenitor, frontend]
    # Build deployment images and deploy them on the same self-hosted Docker runner.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      # Compare against the commit last deployed, not just this push: a push whose
      # tests failed (or that only touched CI files) must not leave production
      # behind for good. The commit is recorded after the liveness checks pass.
      - name: Detect deploy-affecting changes
        id: changes
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED="$(docker run --rm -v progenitor-deploy-state:/state --entrypoint sh \
            ghcr.io/tamaw/progenitor:latest -c 'cat /state/deployed_commit 2>/dev/null' || true)"
          DEPLOYED="$(tr -d '[:space:]' <<< "$DEPLOYED")"
          if [ -z "$DEPLOYED" ] || ! git merge-base --is-ancestor "$DEPLOYED" HEAD 2>/dev/null; then
            echo "No usable deployed commit (${DEPLOYED:-none}); rebuilding and redeploying everything."
            for output in progenitor_image backend_image frontend_image claude_image redeploy; do
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          echo "Deployed commit: $DEPLOYED"
          changed() { [ -n "$(git diff --name-only "$DEPLOYED" HEAD -- "$@")" ] && echo true || echo false; }
          # Both Python images copy all of app/ (the backend imports app.progenitor).
          PYTHON_COMMON=(app ':!app/frontend' pyproject.toml README.md data/schemas .dockerignore)
          PROGENITOR="$(changed "${PYTHON_COMMON[@]}" docker/progenitor data/instructions data/skills data/agents data/shims)"
          BACKEND="$(changed "${PYTHON_COMMON[@]}" docker/backend data/agents/objects)"
          FRONTEND="$(changed app/frontend docker/frontend)"
          CLAUDE="$(changed docker/claude)"
          # The stack also restarts for compose/deploy-step changes.
          STACK="$(changed docker/docker-compose.progenitor.yml .github/workflows/ci.yml)"
          REDEPLOY=false
          for flag in "$PROGENITOR" "$BACKEND" "$FRONTEND" "$CLAUDE" "$STACK"; do
            if [ "$flag" = true ]; then REDEPLOY=true; fi
          done
          {
            echo "progenitor_image=$PROGENITOR"
            echo "backend_image=$BACKEND"
            echo "frontend_image=$FRONTEND"
            echo "claude_image=$CLAUDE"
            echo "redeploy=$REDEPLOY"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and load progenitor image
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.progenitor_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/progenitor/Dockerfile
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          load: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=progenitor
          tags: |
            ghcr.io/tamaw/progenitor:latest
            ghcr.io/tamaw/progenitor:${{ github.sha }}
          cache-from: type=gha,scope=progenitor-image
          cache-to: type=gha,mode=max,scope=progenitor-image

      - name: Build and load backend image
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.backend_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          load: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=backend
          tags: |
            ghcr.io/tamaw/progenitor-backend:latest
            ghcr.io/tamaw/progenitor-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Build and load frontend image
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.frontend_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          file: docker/frontend/Dockerfile
          load: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=frontend
          tags: |
            ghcr.io/tamaw/progenitor-frontend:latest
            ghcr.io/tamaw/progenitor-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

      - name: Build and load claude image
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.claude_image == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/claude/Dockerfile
          load: true
          labels: |
            com.progenitor.managed=true
            com.progenitor.component=claude
          tags: |
            ghcr.io/tamaw/progenitor-claude:latest
            ghcr.io/tamaw/progenitor-claude:${{ github.sha }}
          cache-from: type=gha,scope=claude-image
          cache-to: type=gha,mode=max,scope=claude-image

      - name: No deploy-affecting changes
        if: ${{ github.event_name != 'workflow_dispatch' && steps.changes.outputs.redeploy != 'true' }}
        run: echo "No deploy-affecting changes detected; skipping image rebuilds and compose restart."

      - name: Ensure external network
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.redeploy == 'true' }}
        run: docker network inspect progenitor_network >/dev/null 2>&1 || docker network create progenitor_network

      - name: Deploy progenitor stack
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.redeploy == 'true' }}
        env:
          PROGENITOR_IMAGE_TAG: latest
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROGENITOR_MODEL_DEFAULT: ${{ vars.PROGENITOR_MODEL_DEFAULT }}
          PROGENITOR_TIMEZONE: ${{ vars.PROGENITOR_TIMEZONE }}
          PROGENITOR_REASONING_ENABLED: ${{ vars.PROGENITOR_REASONING_ENABLED }}
          PROGENITOR_REASONING_EFFORT: ${{ vars.PROGENITOR_REASONING_EFFORT }}
          PROGENITOR_REASONING_SUMMARY: ${{ vars.PROGENITOR_REASONING_SUMMARY }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED }}
          TELEGRAM_POLLING_ENABLED: ${{ vars.TELEGRAM_POLLING_ENABLED }}
          TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Outside the runner checkout; preserve the existing installation layout.
          PROGENITOR_INSTALL_ROOT: /var/lib/progenitor
        run: |
          export PROGENITOR_HOST_LOGS_DIR="$PROGENITOR_INSTALL_ROOT/logs"
          export PROGENITOR_HOST_REPOS_DIR="$PROGENITOR_INSTALL_ROOT/repos"
          export PROGENITOR_HOST_CLAUDE_DIR="$PROGENITOR_INSTALL_ROOT/claude"
          # Check every image before touching the running stack, so a missing image
          # fails the deploy without taking production down. Postgres comes from a
          # registry (compose runs with --pull never), so pull it first.
          docker compose -f docker/docker-compose.progenitor.yml pull postgres
          docker image inspect ghcr.io/tamaw/progenitor:${PROGENITOR_IMAGE_TAG} >/dev/null
          docker image inspect ghcr.io/tamaw/progenitor-backend:${PROGENITOR_IMAGE_TAG} >/dev/null
          docker image inspect ghcr.io/tamaw/progenitor-frontend:${PROGENITOR_IMAGE_TAG} >/dev/null
          docker image inspect ghcr.io/tamaw/progenitor-claude:${PROGENITOR_IMAGE_TAG} >/dev/null
          # If a manual/dev container exists with the same name, docker compose will fail.
          # Removing containers keeps bind-mounted state (logs/repos, plus Postgres) intact.
          docker rm -f progenitor progenitor-backend progenitor-frontend progenitor-agent-claude 2>/dev/null || true
          docker volume inspect progenitor-postgres-data >/dev/null 2>&1 || docker volume create progenitor-postgres-data >/dev/null
          # The runtime runs as UID 10001; log files left by the old root container
          # are not appendable, so hand its log and repos folders over before starting it.
          docker run --rm --user 0 --entrypoint sh \
            -v "$PROGENITOR_HOST_LOGS_DIR:/logs" -v "$PROGENITOR_HOST_REPOS_DIR:/repos" \
            ghcr.io/tamaw/progenitor:${PROGENITOR_IMAGE_TAG} \
            -c 'mkdir -p /logs/progenitor && chown -R 10001:10001 /logs/progenitor /repos'
          docker compose -f docker/docker-compose.progenitor.yml up -d --no-build --pull never
          docker compose -f docker/docker-compose.progenitor.yml ps

      - name: Liveness checks
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.redeploy == 'true' }}
        run: |
          wait_healthy() {
            local name="$1"
            local attempts="${2:-60}"
            local i status
            for i in $(seq 1 "$attempts"); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "$name is healthy"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name to become healthy (status=$status)"
            docker ps -a || true
            docker logs "$name" --tail 200 || true
            return 1
          }

          wait_healthy progenitor-postgres 60
          wait_healthy progenitor-backend 90
          wait_healthy progenitor 120
          wait_healthy progenitor-frontend 60
          wait_healthy progenitor-agent-claude 60

      - name: Record deployed commit
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.redeploy == 'true' }}
        run: |
          docker run --rm --user 0 -v progenitor-deploy-state:/state --entrypoint sh \
            ghcr.io/tamaw/progenitor:latest -c 'echo "$1" > /state/deployed_commit' sh "${{ github.sha }}"
