name: agent-deploy

# Deploy only the agents/MCP servers that changed on merge to main.
# Each changed agent/mcp gets its own Docker container and is registered
# with the LiteLLM proxy.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode: changed (diff HEAD^..HEAD) or all agents/mcps"
        required: false
        default: "changed"
        type: choice
        options:
          - changed
          - all
  push:
    branches: [main]
    paths:
      - "app/agents/**"
      - "app/mcp/**"
      - "docker/runner/**"
      - ".github/workflows/agent-deploy.yml"

concurrency:
  group: agent-deploy-cronix
  # Queue deploys so changes stack safely.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------ detect
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.diff.outputs.agents }}
      mcps: ${{ steps.diff.outputs.mcps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed agents and MCP servers
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          MODE="${MODE:-changed}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${MODE}" = "all" ]; then
            echo "Deploying ALL agents and MCP servers (workflow_dispatch mode=all)"
            AGENTS=$(python -c "import json; from pathlib import Path; skip={'__pycache__','.git','base','.venv','node_modules'}; d=Path('app/agents'); print(json.dumps(sorted([p.name for p in d.iterdir() if p.is_dir() and p.name not in skip and not p.name.startswith('.')])) if d.exists() else [])")
            MCPS=$(python -c "import json; from pathlib import Path; skip={'__pycache__','.git','base','.venv','node_modules'}; d=Path('app/mcp'); print(json.dumps(sorted([p.name for p in d.iterdir() if p.is_dir() and p.name not in skip and not p.name.startswith('.')])) if d.exists() else [])")
          else
            # Compare HEAD^ to HEAD for the merge commit
            CHANGED=$(git diff --name-only HEAD^ HEAD)

            # If the shared runner Dockerfiles changed, rebuild/redeploy ALL agents & MCPs.
            if echo "$CHANGED" | grep -q '^docker/runner/'; then
              echo "docker/runner changed; deploying ALL agents and MCP servers"
              MODE="all"
              AGENTS=$(python -c "import json; from pathlib import Path; skip={'__pycache__','.git','base','.venv','node_modules'}; d=Path('app/agents'); print(json.dumps(sorted([p.name for p in d.iterdir() if p.is_dir() and p.name not in skip and not p.name.startswith('.')])) if d.exists() else [])")
              MCPS=$(python -c "import json; from pathlib import Path; skip={'__pycache__','.git','base','.venv','node_modules'}; d=Path('app/mcp'); print(json.dumps(sorted([p.name for p in d.iterdir() if p.is_dir() and p.name not in skip and not p.name.startswith('.')])) if d.exists() else [])")
            else

            # Extract unique agent dirs from changed paths.
            # Filter to *directories only* to avoid deploying app/agents/.gitkeep, app/agents/__init__.py, etc.
            AGENTS=$(echo "$CHANGED" \
              | awk -F/ '$1=="app" && $2=="agents" {print $3}' \
              | sort -u \
              | while read -r name; do \
                  test -n "$name" || continue; \
                  test -d "app/agents/$name" && echo "$name"; \
                done \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')

            MCPS=$(echo "$CHANGED" \
              | awk -F/ '$1=="app" && $2=="mcp" {print $3}' \
              | sort -u \
              | while read -r name; do \
                  test -n "$name" || continue; \
                  test -d "app/mcp/$name" && echo "$name"; \
                done \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          fi

          echo "agents=$AGENTS" >> "$GITHUB_OUTPUT"
          echo "mcps=$MCPS"     >> "$GITHUB_OUTPUT"
          echo "Changed agents: $AGENTS"
          echo "Changed mcps:   $MCPS"

  # ------------------------------------------------------------------ build agents (GH-hosted)
  build-agent:
    needs: detect-changes
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect agent Dockerfile
        id: dockerfile
        run: |
          if [ -f "app/agents/${{ matrix.agent }}/Dockerfile" ]; then
            echo "file=app/agents/${{ matrix.agent }}/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "Using agent-specific Dockerfile for ${{ matrix.agent }}"
          else
            echo "file=docker/runner/Dockerfile.agent" >> "$GITHUB_OUTPUT"
            echo "Using generic Dockerfile.agent for ${{ matrix.agent }}"
          fi

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
          push: true
          tags: |
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ agents
  deploy-agent:
    needs: [detect-changes, build-agent]
    if: needs.detect-changes.outputs.agents != '[]' && needs.detect-changes.outputs.agents != ''
    runs-on: [self-hosted, Linux, X64]
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate agent directory exists
        run: |
          test -d "app/agents/${{ matrix.agent }}" \
            || { echo "Agent directory app/agents/${{ matrix.agent }} not found"; exit 1; }

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull agent image
        run: docker pull ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest

      - name: Stop existing container (if any)
        run: docker rm -f progenitor-agent-${{ matrix.agent }} 2>/dev/null || true

      - name: Run agent container
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
          GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
          PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL: ${{ secrets.PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL }}
          PROGENITOR_AZURE_STRUCTURED_API_KEY: ${{ secrets.PROGENITOR_AZURE_STRUCTURED_API_KEY }}
          PROGENITOR_AZURE_STRUCTURED_MODEL: ${{ vars.PROGENITOR_AZURE_STRUCTURED_MODEL }}
        run: |
          # Determine port: builder_agent uses 8107, all others use 8080
          PORT=8080
          EXTRA_VOLUMES=""
          EXTRA_ENV=""

          if [ "${{ matrix.agent }}" = "observe_agent" ]; then
            # Observe agent needs read-only access to Progenitor's mounted state + logs.
            EXTRA_VOLUMES="--volumes-from progenitor:ro"
          fi

          if [ "${{ matrix.agent }}" = "builder_agent" ]; then
            PORT=8107
            # Builder agent needs the repo mounted (for worktrees) and gh auth
            EXTRA_VOLUMES="--volumes-from progenitor -v /var/repo:/repo"
            EXTRA_ENV="-e GH_TOKEN=${GH_TOKEN} -e PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL=${PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL} -e PROGENITOR_AZURE_STRUCTURED_API_KEY=${PROGENITOR_AZURE_STRUCTURED_API_KEY} -e PROGENITOR_AZURE_STRUCTURED_MODEL=${PROGENITOR_AZURE_STRUCTURED_MODEL}"
          fi

          docker run -d \
            --name progenitor-agent-${{ matrix.agent }} \
            --restart unless-stopped \
            --network langfuse_network \
            -p ${PORT}:${PORT} \
            ${EXTRA_VOLUMES} \
            -e LITELLM_BASE_URL="${LITELLM_BASE_URL}" \
            -e LITELLM_MASTER_KEY="${LITELLM_MASTER_KEY}" \
            -e TEST_MODE=false \
            ${EXTRA_ENV} \
            ghcr.io/tamaw/progenitor-agent-${{ matrix.agent }}:latest

      - name: Wait for agent to become healthy
        run: |
          # builder_agent listens on 8107, all others on 8080
          PORT=8080
          if [ "${{ matrix.agent }}" = "builder_agent" ]; then PORT=8107; fi

          echo "Waiting for agent ${{ matrix.agent }} on port ${PORT}..."
          for i in $(seq 1 30); do
            if docker exec progenitor-agent-${{ matrix.agent }} \
              python -c "import httpx; r = httpx.get('http://localhost:${PORT}/health'); r.raise_for_status()" 2>/dev/null; then
              echo "Agent ${{ matrix.agent }} is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Agent ${{ matrix.agent }} failed health check"
          docker logs progenitor-agent-${{ matrix.agent }} --tail 50
          exit 1

      - name: Update Progenitor agent registry entry
        run: |
          CODE="import json,os; from datetime import datetime,timezone; from pathlib import Path; name=os.environ['AGENT_NAME']; endpoint=f'http://progenitor-agent-{name}:8080'; card_url=f'{endpoint}/.well-known/agent.json'; path=Path('/app/data/state/registry.json'); path.parent.mkdir(parents=True, exist_ok=True); data=json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'agents': [], 'tools': []}; agents=list(data.get('agents') or []); now=datetime.now(timezone.utc).isoformat(); existing=next((a for a in agents if a.get('name')==name), {}); created_at=existing.get('created_at', now); enabled=existing.get('enabled', True); entry={**existing, 'name': name, 'kind': 'a2a_agent', 'enabled': enabled, 'created_at': created_at, 'transport': 'http', 'endpoint': endpoint, 'agent_card_url': card_url, 'status': 'running', 'updated_at': now}; data['agents']=[a for a in agents if a.get('name')!=name]+[entry]; path.write_text(json.dumps(data, indent=2, sort_keys=False), encoding='utf-8'); print(f'Updated registry entry for {name} -> {endpoint}')"
          docker exec -e AGENT_NAME="${AGENT_NAME}" progenitor python -c "$CODE"
        env:
          AGENT_NAME: ${{ matrix.agent }}

      - name: Register agent with LiteLLM
        continue-on-error: true
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
        run: |
          # Determine the container's internal address on the docker network
          AGENT_HOST="progenitor-agent-${{ matrix.agent }}"
          AGENT_URL="http://${AGENT_HOST}:8080/v1"

          REGISTER_BASE_URL="${LITELLM_BASE_URL:-http://litellm:4000}"
          if echo "$REGISTER_BASE_URL" | grep -Eq "://(localhost|127\\.0\\.0\\.1)"; then
            REGISTER_BASE_URL="http://litellm:4000"
          fi

          # Register from inside the docker network so `litellm` DNS resolves.
          docker run --rm --network langfuse_network curlimages/curl:8.6.0 \
            -fsS -X POST "${REGISTER_BASE_URL}/model/new" \
            -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"model_name\": \"agent/${{ matrix.agent }}\",
              \"litellm_params\": {
                \"model\": \"openai/${{ matrix.agent }}\",
                \"api_base\": \"${AGENT_URL}\",
                \"api_key\": \"${LITELLM_MASTER_KEY}\"
              },
              \"model_info\": {
                \"description\": \"Self-contained agent: ${{ matrix.agent }}\",
                \"id\": \"agent-${{ matrix.agent }}\"
              }
            }"
          echo ""
          echo "Registered agent/${{ matrix.agent }} with LiteLLM at ${AGENT_URL}"

  # ------------------------------------------------------------------ build mcps (GH-hosted)
  build-mcp:
    needs: detect-changes
    if: needs.detect-changes.outputs.mcps != '[]' && needs.detect-changes.outputs.mcps != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.detect-changes.outputs.mcps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runner/Dockerfile.mcp
          build-args: |
            MCP_NAME=${{ matrix.mcp }}
          push: true
          tags: |
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ mcps
  deploy-mcp:
    needs: [detect-changes, build-mcp]
    if: needs.detect-changes.outputs.mcps != '[]' && needs.detect-changes.outputs.mcps != ''
    runs-on: [self-hosted, Linux, X64]
    environment: cronix
    strategy:
      fail-fast: false
      matrix:
        mcp: ${{ fromJson(needs.detect-changes.outputs.mcps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate MCP directory exists
        run: |
          test -d "app/mcp/${{ matrix.mcp }}" \
            || { echo "MCP directory app/mcp/${{ matrix.mcp }} not found"; exit 1; }

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull MCP image
        run: docker pull ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest

      - name: Stop existing container (if any)
        run: docker rm -f progenitor-mcp-${{ matrix.mcp }} 2>/dev/null || true

      - name: Run MCP container
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
        run: |
          docker run -d \
            --name progenitor-mcp-${{ matrix.mcp }} \
            --restart unless-stopped \
            --network langfuse_network \
            -e LITELLM_BASE_URL="${LITELLM_BASE_URL}" \
            -e LITELLM_MASTER_KEY="${LITELLM_MASTER_KEY}" \
            -e TEST_MODE=false \
            ghcr.io/tamaw/progenitor-mcp-${{ matrix.mcp }}:latest

      - name: Wait for MCP server to become healthy
        run: |
          echo "Waiting for MCP container to start..."
          for i in $(seq 1 30); do
            if docker exec progenitor-mcp-${{ matrix.mcp }} \
              python -c "import httpx; r = httpx.get('http://localhost:8080/health'); r.raise_for_status()" 2>/dev/null; then
              echo "MCP ${{ matrix.mcp }} is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MCP ${{ matrix.mcp }} failed health check"
          docker logs progenitor-mcp-${{ matrix.mcp }} --tail 50
          exit 1

      - name: Register MCP with LiteLLM
        continue-on-error: true
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || vars.LITELLM_BASE_URL }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY || vars.LITELLM_MASTER_KEY }}
        run: |
          MCP_HOST="progenitor-mcp-${{ matrix.mcp }}"
          MCP_URL="http://${MCP_HOST}:8080/v1"

          REGISTER_BASE_URL="${LITELLM_BASE_URL:-http://litellm:4000}"
          if echo "$REGISTER_BASE_URL" | grep -Eq "://(localhost|127\\.0\\.0\\.1)"; then
            REGISTER_BASE_URL="http://litellm:4000"
          fi

          docker run --rm --network langfuse_network curlimages/curl:8.6.0 \
            -fsS -X POST "${REGISTER_BASE_URL}/model/new" \
            -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"model_name\": \"mcp/${{ matrix.mcp }}\",
              \"litellm_params\": {
                \"model\": \"openai/${{ matrix.mcp }}\",
                \"api_base\": \"${MCP_URL}\",
                \"api_key\": \"${LITELLM_MASTER_KEY}\"
              },
              \"model_info\": {
                \"description\": \"MCP server: ${{ matrix.mcp }}\",
                \"id\": \"mcp-${{ matrix.mcp }}\"
              }
            }"
          echo ""
          echo "Registered mcp/${{ matrix.mcp }} with LiteLLM at ${MCP_URL}"
