name: litellm-deploy

on:
  push:
    branches: [main]
    paths:
      - docker/litellm/**
      - litellm-config.yaml
      - docker/docker-compose.litellm.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push litellm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/litellm/Dockerfile
          push: true
          tags: ghcr.io/tamaw/progenitor-litellm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: [self-hosted, Linux, X64]
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and restart litellm stack
        run: |
          docker pull ghcr.io/tamaw/progenitor-litellm:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            docker/compose:2.27.0 \
            -f docker/docker-compose.litellm.yml pull litellm
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            docker/compose:2.27.0 \
            -f docker/docker-compose.litellm.yml up -d

