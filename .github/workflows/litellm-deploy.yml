name: litellm-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/litellm/Dockerfile
      - docker/litellm/litellm-config.yaml
      - docker/docker-compose.litellm.yml
      - .github/workflows/litellm-deploy.yml

concurrency:
  group: litellm-deploy-cronix
  # Queue deploys so changes stack safely.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push litellm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/litellm/Dockerfile
          push: true
          tags: |
            ghcr.io/tamaw/progenitor-litellm:latest
            ghcr.io/tamaw/progenitor-litellm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/caddy/Dockerfile
          push: true
          tags: |
            ghcr.io/tamaw/progenitor-litellm-caddy:latest
            ghcr.io/tamaw/progenitor-litellm-caddy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    environment: cronix
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      - name: Docker login (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and restart litellm stack
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          LITELLM_DB_PASSWORD: ${{ secrets.LITELLM_DB_PASSWORD }}
          AZURE_RESPONSES_API_BASE: ${{ secrets.AZURE_RESPONSES_API_BASE }}
          AZURE_RESPONSES_API_KEY: ${{ secrets.AZURE_RESPONSES_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          test -n "$LITELLM_MASTER_KEY" || (echo "Missing/empty secret: LITELLM_MASTER_KEY" && exit 1)
          docker network inspect progenitor_network >/dev/null 2>&1 || docker network create progenitor_network
          cat > .litellm.env <<EOF
          LITELLM_DB_PASSWORD=${LITELLM_DB_PASSWORD}
          LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
          AZURE_RESPONSES_API_BASE=${AZURE_RESPONSES_API_BASE}
          AZURE_RESPONSES_API_KEY=${AZURE_RESPONSES_API_KEY}
          LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
          LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
          JINA_API_KEY=${JINA_API_KEY}
          EOF
          docker compose --env-file .litellm.env -f docker/docker-compose.litellm.yml pull
          docker compose --env-file .litellm.env -f docker/docker-compose.litellm.yml up -d
