<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progenitor - Logs</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/logs-page.css">
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
</head>
<body>
    <div id="app" class="dashboard-container">
        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <span class="brand-icon">🧬</span>
                <h1>Progenitor Logs</h1>
            </div>
            <nav class="header-nav">
                <a href="/ui" class="nav-link">💬 Chat</a>
                <a href="/ui/dashboard" class="nav-link">📊 Dashboard</a>
                <a href="/ui/agents" class="nav-link">🤖 Agents</a>
                <a href="/ui/logs" class="nav-link active">📜 Logs</a>
            </nav>
            <div class="header-status">
                <span id="connection-status" class="status-indicator" data-status="disconnected">
                    <span class="status-dot"></span>
                    <span class="status-text">Disconnected</span>
                </span>
            </div>
            <div class="header-actions">
                <button id="btn-refresh" class="btn-icon" title="Refresh">🔄</button>
                <button id="btn-theme" class="btn-icon" title="Toggle Theme">🌙</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="logs-main">
            <!-- Logs Toolbar -->
            <section class="logs-toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="log-search" placeholder="Search logs..." class="search-input">
                    </div>
                    <select id="log-level-filter" class="filter-select">
                        <option value="all">All Levels</option>
                        <option value="debug">Debug</option>
                        <option value="info">Info</option>
                        <option value="warn">Warning</option>
                        <option value="error">Error</option>
                    </select>
                    <select id="log-source-filter" class="filter-select">
                        <option value="all">All Sources</option>
                        <option value="progenitor">Progenitor</option>
                        <option value="planner">Planner</option>
                        <option value="executor">Executor</option>
                        <option value="chat_server">Chat Server</option>
                        <option value="llm">LLM Client</option>
                    </select>
                </div>
                <div class="toolbar-right">
                    <div class="log-stats">
                        <span class="stat"><span id="log-count">0</span> entries</span>
                        <span class="stat error"><span id="error-count">0</span> errors</span>
                        <span class="stat warning"><span id="warn-count">0</span> warnings</span>
                    </div>
                    <div class="toolbar-actions">
                        <button id="btn-auto-scroll" class="btn-mini active" title="Auto-scroll">⬇️</button>
                        <button id="btn-pause" class="btn-mini" title="Pause">⏸️</button>
                        <button id="btn-clear" class="btn-mini" title="Clear">🗑️</button>
                        <button id="btn-export" class="btn-mini" title="Export">📥</button>
                    </div>
                </div>
            </section>

            <!-- Log Stats Bar -->
            <section class="log-stats-bar">
                <div class="log-level-breakdown">
                    <div class="level-bar debug" id="level-debug-bar" style="width: 0%"></div>
                    <div class="level-bar info" id="level-info-bar" style="width: 0%"></div>
                    <div class="level-bar warn" id="level-warn-bar" style="width: 0%"></div>
                    <div class="level-bar error" id="level-error-bar" style="width: 0%"></div>
                </div>
                <div class="level-legend">
                    <span class="legend-item debug">Debug</span>
                    <span class="legend-item info">Info</span>
                    <span class="legend-item warn">Warning</span>
                    <span class="legend-item error">Error</span>
                </div>
            </section>

            <!-- Logs Container -->
            <section class="logs-container-full" id="logs-container">
                <div class="empty-state">
                    <span class="empty-icon">📜</span>
                    <span>Waiting for logs...</span>
                    <span class="empty-hint">Logs will appear here in real-time</span>
                </div>
            </section>

            <!-- Log Detail Viewer -->
            <section class="log-detail hidden" id="log-detail">
                <div class="detail-header">
                    <h3>Log Details</h3>
                    <button class="btn-mini" id="close-detail">×</button>
                </div>
                <div class="detail-content" id="detail-content">
                    <!-- Populated by JS -->
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="dashboard-footer">
            <div class="footer-info">
                <span>Progenitor v<span id="version">0.1.0</span></span>
                <span class="separator">•</span>
                <span id="log-status">Live</span>
            </div>
            <div class="footer-status">
                <span class="pulse-dot" id="pulse-indicator"></span>
                <span>Last update: <span id="last-update">--</span></span>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/js/config.js?v=3"></script>
    <script src="/js/api.js?v=3"></script>
    <script type="module" src="/js/logs-page.js?v=1"></script>
</body>
</html>
