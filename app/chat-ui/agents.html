<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progenitor - Agents</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/agents.css">
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
    <!-- Chart.js for beautiful graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="app" class="dashboard-container">
        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <span class="brand-icon">🧬</span>
                <h1>Progenitor Agents</h1>
            </div>
            <nav class="header-nav">
                <a href="/ui" class="nav-link">💬 Chat</a>
                <a href="/ui/dashboard" class="nav-link">📊 Dashboard</a>
                <a href="/ui/agents" class="nav-link active">🤖 Agents</a>
                <a href="/ui/logs" class="nav-link">📜 Logs</a>
            </nav>
            <div class="header-status">
                <span id="connection-status" class="status-indicator" data-status="disconnected">
                    <span class="status-dot"></span>
                    <span class="status-text">Disconnected</span>
                </span>
            </div>
            <div class="header-actions">
                <button id="btn-refresh" class="btn-icon" title="Refresh Data">🔄</button>
                <button id="btn-theme" class="btn-icon" title="Toggle Theme">🌙</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="agents-main">
            <!-- Search and Filters -->
            <section class="agents-toolbar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="agent-search" placeholder="Search agents..." class="search-input">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="ready">Ready</button>
                    <button class="filter-btn" data-filter="busy">Busy</button>
                    <button class="filter-btn" data-filter="offline">Offline</button>
                </div>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid" title="Grid View">◫</button>
                    <button class="view-btn" data-view="list" title="List View">☰</button>
                </div>
            </section>

            <!-- Summary Stats -->
            <section class="agents-summary">
                <div class="summary-card">
                    <span class="summary-icon">🤖</span>
                    <div class="summary-data">
                        <span class="summary-value" id="total-agents">0</span>
                        <span class="summary-label">Total Agents</span>
                    </div>
                </div>
                <div class="summary-card success">
                    <span class="summary-icon">✓</span>
                    <div class="summary-data">
                        <span class="summary-value" id="ready-agents">0</span>
                        <span class="summary-label">Ready</span>
                    </div>
                </div>
                <div class="summary-card warning">
                    <span class="summary-icon">⏳</span>
                    <div class="summary-data">
                        <span class="summary-value" id="busy-agents">0</span>
                        <span class="summary-label">Busy</span>
                    </div>
                </div>
                <div class="summary-card info">
                    <span class="summary-icon">🎯</span>
                    <div class="summary-data">
                        <span class="summary-value" id="total-requests">0</span>
                        <span class="summary-label">Total Requests</span>
                    </div>
                </div>
                <div class="summary-card tokens">
                    <span class="summary-icon">📊</span>
                    <div class="summary-data">
                        <span class="summary-value" id="total-tokens">0</span>
                        <span class="summary-label">Total Tokens</span>
                    </div>
                </div>
            </section>

            <!-- Agents Grid -->
            <section class="agents-grid" id="agents-container">
                <div class="empty-state">
                    <span class="empty-icon">🤖</span>
                    <span>Loading agents...</span>
                </div>
            </section>
        </main>

        <!-- Agent Detail Drawer -->
        <aside class="agent-drawer hidden" id="agent-drawer">
            <div class="drawer-header">
                <div class="drawer-title">
                    <span class="drawer-icon" id="drawer-icon">🤖</span>
                    <h2 id="drawer-agent-name">Agent Name</h2>
                </div>
                <button class="drawer-close" id="drawer-close">×</button>
            </div>
            <div class="drawer-content" id="drawer-content">
                <!-- Populated by JS -->
            </div>
        </aside>
        <div class="drawer-backdrop hidden" id="drawer-backdrop"></div>

        <!-- Footer -->
        <footer class="dashboard-footer">
            <div class="footer-info">
                <span>Progenitor v<span id="version">0.1.0</span></span>
                <span class="separator">•</span>
                <span><span id="agent-count">0</span> agents registered</span>
            </div>
            <div class="footer-status">
                <span class="pulse-dot" id="pulse-indicator"></span>
                <span>Last update: <span id="last-update">--</span></span>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/js/config.js?v=3"></script>
    <script src="/js/api.js?v=3"></script>
    <script type="module" src="/js/agents-page.js?v=1"></script>
</body>
</html>
