runtime:
  port: 8080
  mounts:
    - host_path: /var/lib/progenitor/data/state/agents/observe_agent
      container_path: /app/data/state
    - host_path: /var/lib/progenitor/logs
      container_path: /app/logs
    - host_path: /var/lib/progenitor/worktrees
      container_path: /app/worktrees
  env_keys:
    - AZURE_OPENAI_BASE_URL
    - AZURE_OPENAI_API_KEY
    - GH_TOKEN
    - COPILOT_GITHUB_TOKEN
    - PROGENITOR_MODEL_DEFAULT
