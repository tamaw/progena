runtime:
  port: 8108
  mounts:
    - host_path: /var/lib/progenitor/data/state/agents/builder_progenitor
      container_path: /app/data/state
    - host_path: /var/lib/progenitor/logs
      container_path: /app/logs
    - host_path: /var/lib/progenitor/worktrees
      container_path: /app/worktrees
  env_keys:
    - AZURE_OPENAI_BASE_URL
    - AZURE_OPENAI_API_KEY
    - GH_TOKEN
    - COPILOT_GITHUB_TOKEN
    - GIT_AUTHOR_NAME
    - GIT_AUTHOR_EMAIL
    - PROGENITOR_REPO_URL
    - AGENT_MODEL_DEFAULT
    - OVERRIDE_AGENT_PLANNER_MODEL
    - OVERRIDE_AGENT_BUILDER_MODEL
    - DEFAULT_COPILOT_MODEL
    - PROGENITOR_COPILOT_ADDITIONAL_FLAGS
