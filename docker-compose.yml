services:
  progenitor:
    build: .
    container_name: progenitor
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_DEFAULT=${AZURE_OPENAI_DEPLOYMENT_DEFAULT}
      - TZ=UTC
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
      - ./worktrees:/app/worktrees
      - ./config:/app/config:ro
    stdin_open: true
    tty: true
    networks:
      - progenitor-net

  chat_server:
    build: .
    container_name: progenitor-chat-server
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.chat_server.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - CHAT_SERVER_HOST=0.0.0.0
      - CHAT_SERVER_PORT=8000
      - CHAT_SERVER_PROGENITOR_TIMEOUT=300
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_DEFAULT=${AZURE_OPENAI_DEPLOYMENT_DEFAULT}
    ports:
      - "8000:8000"
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      - progenitor
    networks:
      - progenitor-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  progenitor-net:
    driver: bridge
