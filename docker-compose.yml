# ==============================================================================
# Shared Configuration (YAML Anchors)
# ==============================================================================
x-progenitor-llm-env: &progenitor-llm-env
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
  LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
  PROGENITOR_MODEL_DEFAULT: ${PROGENITOR_MODEL_DEFAULT:-gpt-5.1-codex-max}

services:
  # =============================================================================
  # LiteLLM Proxy (LLM routing + Langfuse observability)
  # =============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    networks:
      - progenitor-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  # =============================================================================
  # Progenitor Application Stack
  # =============================================================================
  progenitor:
    build: .
    container_name: progenitor
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      <<: *progenitor-llm-env
      TZ: UTC
    volumes:
      - ./data/state:/app/data/state
      - ./data/prompts:/app/data/prompts:ro
      - ./logs:/app/logs
      - ./worktrees:/app/worktrees
      - ./config:/app/config:ro
      - ./tmp:/app/tmp
    stdin_open: true
    tty: true
    networks:
      - progenitor-net
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  backend:
    build: .
    container_name: progenitor-backend
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      progenitor:
        condition: service_started
      litellm:
        condition: service_healthy
    environment:
      <<: *progenitor-llm-env
      CHAT_SERVER_HOST: 0.0.0.0
      CHAT_SERVER_PORT: 8000
      CHAT_SERVER_PROGENITOR_TIMEOUT: 300
    ports:
      - "8000:8000"
    volumes:
      - ./data/state:/app/data/state
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./tmp:/app/tmp
    networks:
      - progenitor-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

networks:
  progenitor-net:
    driver: bridge
