# Pre-commit configuration for Progenitor
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(src/frontend/|\.md$)
      - id: end-of-file-fixer
        exclude: ^src/frontend/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # Python code formatting with Ruff (fast, replaces black + isort + flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      # Linting
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^tests/
      # Formatting (replaces black)
      - id: ruff-format
        exclude: ^src/frontend/

  # Type checking with pyright. Deliberately a `local` hook running the project
  # venv's pyright rather than an isolated pre-commit env: the previous
  # mirrors-mypy hook installed only pydantic plus a few stub packages, so every
  # real dependency resolved to Any and the hook passed on code CI rejected.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: .venv/bin/pyright
        language: system
        types: [python]
        pass_filenames: false
        # --pythonpath is required: git runs hooks without the venv activated,
        # and pyright will not read the interpreter from pyproject.toml.
        args: [--pythonpath, .venv/bin/python, src/]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3013]

# Configuration for specific tools
default_language_version:
  python: python3

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  # pyright is a local hook needing the project venv, which pre-commit.ci has
  # no way to build; the ci workflow's `pyright src/` step covers it there.
  skip: [pyright]
  submodules: false
