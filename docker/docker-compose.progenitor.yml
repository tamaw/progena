# ==============================================================================
# Shared Configuration (YAML Anchors)
# ==============================================================================
x-progenitor-llm-env: &progenitor-llm-env
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
  PROGENITOR_MODEL_DEFAULT: ${PROGENITOR_MODEL_DEFAULT:-gpt-5.1-codex-max}
  GH_TOKEN: ${GH_TOKEN:-}
  PROGENITOR_REASONING_ENABLED: ${PROGENITOR_REASONING_ENABLED:-false}
  PROGENITOR_REASONING_BUDGET_TOKENS: ${PROGENITOR_REASONING_BUDGET_TOKENS:-}

services:
  # =============================================================================
  # Progenitor Application Stack
  # =============================================================================
  progenitor:
    image: ghcr.io/tamaw/progenitor:latest
    build:
      context: ..
      dockerfile: docker/progenitor/Dockerfile
    container_name: progenitor
    restart: unless-stopped
    environment:
      <<: *progenitor-llm-env
      AGENT_NAME: progenitor
      PROGENITOR_STATE_DIR: /app/data/state
      PROGENITOR_LOG_DIR: /app/logs
      PROGENITOR_WORKTREE_DIR: /app/worktrees
      PROGENITOR_PROMPTS_DIR: /app/prompts
      TZ: UTC
      # Bind IPC on all interfaces so other containers (backend) can connect.
      PROGENITOR_IPC_HOST: 0.0.0.0
    volumes:
      - ${PROGENITOR_HOST_DATA_DIR:-../data}:/app/data
      - ${PROGENITOR_HOST_LOGS_DIR:-../logs}:/app/logs
      - ${PROGENITOR_HOST_PROMPTS_DIR:-../prompts}:/app/prompts
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,size=1g
    stdin_open: true
    tty: true
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  backend:
    image: ghcr.io/tamaw/progenitor-backend:latest
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: progenitor-backend
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      progenitor:
        condition: service_started
    environment:
      <<: *progenitor-llm-env
      CHAT_SERVER_HOST: 0.0.0.0
      CHAT_SERVER_PORT: 8000
      CHAT_SERVER_PROGENITOR_TIMEOUT: 300
      # Backend runs in a separate container; connect to IPC via service DNS.
      CHAT_SERVER_IPC_HOST: progenitor
      CHAT_SERVER_IPC_PORT: 9500
      # Telegram integration (backend only)
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
    volumes:
      - ${PROGENITOR_HOST_DATA_DIR:-../data}:/app/data
      - ${PROGENITOR_HOST_LOGS_DIR:-../logs}:/app/logs
      - ${PROGENITOR_HOST_PROMPTS_DIR:-../prompts}:/app/prompts
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,size=512m
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  frontend:
    image: ghcr.io/tamaw/progenitor-frontend:latest
    build:
      context: ../app/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    container_name: progenitor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

networks:
  progenitor-net:
    driver: bridge
  # Shared external network for progenitor stack components.
  progenitor_network:
    external: true
