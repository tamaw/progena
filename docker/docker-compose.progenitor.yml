# ==============================================================================
# Shared Configuration (YAML Anchors)
# ==============================================================================
x-progenitor-llm-env: &progenitor-llm-env
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
  JINA_API_KEY: ${JINA_API_KEY:-}
  PROGENITOR_MODEL_DEFAULT: ${PROGENITOR_MODEL_DEFAULT:-gpt-5.1-codex-max}
  PROGENITOR_REASONING_ENABLED: ${PROGENITOR_REASONING_ENABLED:-true}
  PROGENITOR_REASONING_EFFORT: ${PROGENITOR_REASONING_EFFORT:-low}
  PROGENITOR_REASONING_SUMMARY: ${PROGENITOR_REASONING_SUMMARY:-auto}

x-progenitor-database-env: &progenitor-database-env
  PROGENITOR_DATABASE_URL: ${PROGENITOR_DATABASE_URL:-postgresql://progenitor:progenitor@postgres:5432/progenitor}
  PROGENITOR_DATABASE_SETUP: ${PROGENITOR_DATABASE_SETUP:-true}
  PROGENITOR_DATABASE_POOL_MIN_SIZE: ${PROGENITOR_DATABASE_POOL_MIN_SIZE:-1}
  PROGENITOR_DATABASE_POOL_MAX_SIZE: ${PROGENITOR_DATABASE_POOL_MAX_SIZE:-10}

services:
  postgres:
    image: postgres:16-alpine
    container_name: progenitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-progenitor}
      POSTGRES_USER: ${POSTGRES_USER:-progenitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-progenitor}
    volumes:
      - progenitor-postgres-data:/var/lib/postgresql/data
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-progenitor} -d ${POSTGRES_DB:-progenitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Progenitor Application Stack
  # =============================================================================
  progenitor:
    image: ghcr.io/tamaw/progenitor:${PROGENITOR_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/progenitor/Dockerfile
    container_name: progenitor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*progenitor-llm-env, *progenitor-database-env]
      AGENT_NAME: progenitor
      PROGENITOR_TIMEZONE: ${PROGENITOR_TIMEZONE:-UTC}
      TZ: ${PROGENITOR_TIMEZONE:-UTC}
      # Bind IPC on all interfaces so other containers (backend) can connect.
      PROGENITOR_IPC_HOST: 0.0.0.0
    volumes:
      - ${PROGENITOR_HOST_DATA_DIR:-../data}:/app/data
      - ${PROGENITOR_HOST_PROMPTS_DIR:-../data/prompts}:/app/data/prompts:ro
      - ${PROGENITOR_HOST_SKILLS_DIR:-../data/skills}:/app/data/skills:ro
      - ${PROGENITOR_HOST_LOGS_DIR:-../logs}:/app/logs
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,size=1g
    stdin_open: true
    tty: true
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  backend:
    image: ghcr.io/tamaw/progenitor-backend:${PROGENITOR_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: progenitor-backend
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      progenitor:
        condition: service_started
    environment:
      <<: *progenitor-llm-env
      CHAT_SERVER_HOST: 0.0.0.0
      CHAT_SERVER_PORT: 8000
      CHAT_SERVER_PROGENITOR_TIMEOUT: 300
      # Backend runs in a separate container; connect to IPC via service DNS.
      CHAT_SERVER_IPC_HOST: progenitor
      CHAT_SERVER_IPC_PORT: 9500
      # Telegram integration (backend only)
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
    volumes:
      - ${PROGENITOR_HOST_DATA_DIR:-../data}:/app/data
      - ${PROGENITOR_HOST_PROMPTS_DIR:-../data/prompts}:/app/data/prompts:ro
      - ${PROGENITOR_HOST_SKILLS_DIR:-../data/skills}:/app/data/skills:ro
      - ${PROGENITOR_HOST_LOGS_DIR:-../logs}:/app/logs
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,size=512m
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  frontend:
    image: ghcr.io/tamaw/progenitor-frontend:${PROGENITOR_IMAGE_TAG:-latest}
    build:
      context: ../app/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    container_name: progenitor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

networks:
  progenitor-net:
    driver: bridge
  # Shared external network for progenitor stack components.
  progenitor_network:
    external: true

volumes:
  progenitor-postgres-data:
