# ==============================================================================
# Shared Configuration (YAML Anchors)
# ==============================================================================
x-progenitor-llm-env: &progenitor-llm-env
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
  LITELLM_API_KEY: ${LITELLM_API_KEY:-}
  LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
  PROGENITOR_MODEL_DEFAULT: ${PROGENITOR_MODEL_DEFAULT:-gpt-5.1-codex-max}
  GH_TOKEN: ${GH_TOKEN:-}
  PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL: ${PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL:-}
  PROGENITOR_AZURE_STRUCTURED_API_KEY: ${PROGENITOR_AZURE_STRUCTURED_API_KEY:-}
  PROGENITOR_AZURE_STRUCTURED_MODEL: ${PROGENITOR_AZURE_STRUCTURED_MODEL:-}

services:
  # =============================================================================
  # Progenitor Application Stack
  # =============================================================================
  progenitor:
    image: ghcr.io/tamaw/progenitor:latest
    build:
      context: ..
      dockerfile: docker/progenitor/Dockerfile
    container_name: progenitor
    restart: unless-stopped
    environment:
      <<: *progenitor-llm-env
      TZ: UTC
      # Bind IPC on all interfaces so other containers (backend) can connect.
      PROGENITOR_IPC_HOST: 0.0.0.0
    volumes:
      - ../data/state:/app/data/state
      - ../logs:/app/logs
      - ../worktrees:/app/worktrees
      - ../tmp:/app/tmp
    stdin_open: true
    tty: true
    networks:
      - progenitor-net
      - langfuse_network
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  backend:
    image: ghcr.io/tamaw/progenitor-backend:latest
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: progenitor-backend
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      progenitor:
        condition: service_started
    environment:
      <<: *progenitor-llm-env
      CHAT_SERVER_HOST: 0.0.0.0
      CHAT_SERVER_PORT: 8000
      CHAT_SERVER_PROGENITOR_TIMEOUT: 300
      # Backend runs in a separate container; connect to IPC via service DNS.
      CHAT_SERVER_IPC_HOST: progenitor
      CHAT_SERVER_IPC_PORT: 9500
      # Telegram integration (backend only)
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
    ports:
      - "8000:8000"
    volumes:
      - ../data/state:/app/data/state
      - ../logs:/app/logs
      - ../tmp:/app/tmp
    networks:
      - progenitor-net
      - langfuse_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  progenitor-agent-observe_agent:
    image: ghcr.io/tamaw/progenitor-agent-observe_agent:latest
    build:
      context: ..
      dockerfile: docker/runner/Dockerfile.agent
      args:
        AGENT_NAME: observe_agent
    container_name: progenitor-agent-observe_agent
    restart: unless-stopped
    depends_on:
      progenitor:
        condition: service_started
    environment:
      <<: *progenitor-llm-env
      TZ: UTC
    volumes:
      - ../data/state:/app/data/state:ro
      - ../logs:/app/logs:ro
    networks:
      - progenitor-net
      - langfuse_network

networks:
  progenitor-net:
    driver: bridge
  # Shared external network used by docker-compose.litellm.yml (so "litellm" resolves by name).
  langfuse_network:
    external: true
