# ==============================================================================
# Shared Configuration (YAML Anchors)
# ==============================================================================
x-progenitor-llm-env: &progenitor-llm-env
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
  JINA_API_KEY: ${JINA_API_KEY:-}
  PROGENITOR_MODEL_DEFAULT: ${PROGENITOR_MODEL_DEFAULT:-gpt-5.1-codex-max}
  PROGENITOR_REASONING_ENABLED: ${PROGENITOR_REASONING_ENABLED:-true}
  PROGENITOR_REASONING_EFFORT: ${PROGENITOR_REASONING_EFFORT:-low}
  PROGENITOR_REASONING_SUMMARY: ${PROGENITOR_REASONING_SUMMARY:-auto}

x-progenitor-database-env: &progenitor-database-env
  PROGENITOR_DATABASE_URL: ${PROGENITOR_DATABASE_URL:-postgresql://progenitor:progenitor@postgres:5432/progenitor}
  PROGENITOR_DATABASE_SETUP: ${PROGENITOR_DATABASE_SETUP:-true}
  PROGENITOR_DATABASE_POOL_MIN_SIZE: ${PROGENITOR_DATABASE_POOL_MIN_SIZE:-1}
  PROGENITOR_DATABASE_POOL_MAX_SIZE: ${PROGENITOR_DATABASE_POOL_MAX_SIZE:-10}

services:
  postgres:
    image: postgres:16-alpine
    container_name: progenitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-progenitor}
      POSTGRES_USER: ${POSTGRES_USER:-progenitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-progenitor}
    volumes:
      - progenitor-postgres-data:/var/lib/postgresql/data
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-progenitor} -d ${POSTGRES_DB:-progenitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Progenitor Application Stack
  # =============================================================================
  progenitor:
    image: ghcr.io/tamaw/progenitor:${PROGENITOR_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/progenitor/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: progenitor
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*progenitor-llm-env, *progenitor-database-env]
      AGENT_NAME: progenitor
      PROGENITOR_TIMEZONE: ${PROGENITOR_TIMEZONE:-UTC}
      PROGENITOR_WORKTREE_DIR: /app/repos
      TZ: ${PROGENITOR_TIMEZONE:-UTC}
      # Bind the runtime HTTP server on all interfaces so other containers (backend) can connect.
      PROGENITOR_HTTP_HOST: 0.0.0.0
      GH_TOKEN: ${GH_TOKEN:-}
      PROGENITOR_SHELL_HOME: /app/agent-home
      PROGENITOR_SHELL_SHIM_BIN: /app/data/shims/bin
      PROGENITOR_SHELL_TIMEOUT_SECONDS: ${PROGENITOR_SHELL_TIMEOUT_SECONDS:-120}
      # State is transient in the hardened read-only runtime image.
      PROGENITOR_STATE_DIR: /app/tmp/state
    volumes:
      - ${PROGENITOR_HOST_SCHEMAS_DIR:-../data/schemas}:/app/data/schemas:ro
      - ${PROGENITOR_HOST_LOGS_DIR:-../logs}:/app/logs
      - ${PROGENITOR_HOST_REPOS_DIR:-../repos}:/app/repos
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,size=1g
      - /app/agent-home:rw,nosuid,size=64m
    stdin_open: true
    tty: true
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${PROGENITOR_HTTP_PORT:-9501}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
          pids: 512
        reservations:
          memory: 512M

  backend:
    image: ghcr.io/tamaw/progenitor-backend:${PROGENITOR_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: progenitor-backend
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--ssl-keyfile", "/app/certs/key.pem", "--ssl-certfile", "/app/certs/cert.pem"]
    depends_on:
      postgres:
        condition: service_healthy
      progenitor:
        condition: service_started
    environment:
      <<: [*progenitor-llm-env, *progenitor-database-env]
      CHAT_SERVER_HOST: 0.0.0.0
      CHAT_SERVER_PORT: 8000
      CHAT_SERVER_PROGENITOR_TIMEOUT: 300
      PROGENITOR_WORKTREE_DIR: /app/repos
      # Backend runs in a separate container; connect to the runtime HTTP server via service DNS.
      PROGENITOR_RUNTIME_URL: http://progenitor:9501
      # Telegram integration (backend only)
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
    volumes:
      - ${PROGENITOR_HOST_LOGS_DIR:-../logs}:/app/logs
      - ${PROGENITOR_HOST_REPOS_DIR:-../repos}:/app/repos
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,size=512m
    networks:
      - progenitor-net
      - progenitor_network
    # Explicit Docker-only liveness exception; this endpoint returns an empty 200.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1:8000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  frontend:
    image: ghcr.io/tamaw/progenitor-frontend:${PROGENITOR_IMAGE_TAG:-latest}
    build:
      context: ../app/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    container_name: progenitor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "443:443"
    networks:
      - progenitor-net
      - progenitor_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

networks:
  progenitor-net:
    driver: bridge
  # Shared external network for progenitor stack components.
  progenitor_network:
    external: true

volumes:
  progenitor-postgres-data:
    name: progenitor-postgres-data
    external: true
