litellm_settings:
  callbacks:
    - langfuse_otel
  store_model_in_db: true
  store_prompts_in_spend_logs: true

# Proxy-level fallback routing (LiteLLM reliability feature).
# If gpt-5.2-chat errors (rate limit / timeout), try gpt-5-mini then gpt-4.1.
fallbacks:
  - gpt-5.2-chat: ["gpt-5-mini", "gpt-4.1"]

model_list:
  - model_name: gpt-5.2-chat
    litellm_params:
      model: azure/gpt-5.2-chat
      api_base: os.environ/AZURE_RESPONSES_API_BASE
      api_key: os.environ/AZURE_RESPONSES_API_KEY
      api_version: preview
      tpm: 20000
      rpm: 500
      # NOTE: Progenitor requests include tool definitions, so first-token latency can
      # exceed 2s. A low stream_timeout causes spurious APITimeoutError.
      timeout: 30
      stream_timeout: 10
  - model_name: gpt-5-mini
    litellm_params:
      model: azure/gpt-5-mini
      api_base: os.environ/AZURE_RESPONSES_API_BASE
      api_key: os.environ/AZURE_RESPONSES_API_KEY
      api_version: preview
      tpm: 10000
      rpm: 100
      timeout: 20
      stream_timeout: 12
  - model_name: gpt-4.1
    litellm_params:
      model: azure/gpt-4.1
      api_base: os.environ/AZURE_RESPONSES_API_BASE
      api_key: os.environ/AZURE_RESPONSES_API_KEY
      api_version: preview
      tpm: 20000
      rpm: 50
      timeout: 40
      stream_timeout: 22

mcp_servers:
  jina_mcp:
    url: "https://mcp.jina.ai/v1"
    transport: "http"
    auth_type: "bearer_token"
    auth_value: os.environ/JINA_API_KEY
#    allowed_tools:
#      - jina_mcp.search_web
