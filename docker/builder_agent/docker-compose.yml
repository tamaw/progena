# Builder Agent — standalone A2A service
#
# Usage:
#   docker compose -f docker/builder_agent/docker-compose.yml up
#
# Required environment variables (set in .env or shell):
#   GH_TOKEN               — GitHub token for git operations and Copilot CLI
#   PROGENITOR_REPO_URL    — Repo to clone into the workspace on first boot
#                            e.g. https://github.com/tamaw/progenitor.git
#                            Omit if you prefer to bind-mount a pre-cloned repo.
#   LITELLM_BASE_URL       — LiteLLM proxy endpoint (default: http://litellm:4000)
#   LITELLM_API_KEY        — API key for LiteLLM proxy
#
# Optional overrides:
#   PROGENITOR_MODEL_DEFAULT     — LLM model name (default: gpt-5.1-codex-max)
#   PROGENITOR_COPILOT_MODEL     — Copilot model (default: claude-haiku-4.5)

services:
  builder-agent:
    build:
      context: ../..
      dockerfile: app/agents/builder_agent/Dockerfile
    image: ghcr.io/tamaw/builder-agent:latest
    container_name: builder-agent
    restart: unless-stopped
    ports:
      - "8107:8107"
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      PROGENITOR_MODEL_DEFAULT: ${PROGENITOR_MODEL_DEFAULT:-gpt-5.1-codex-max}
      PROGENITOR_COPILOT_MODEL: ${PROGENITOR_COPILOT_MODEL:-claude-haiku-4.5}
      PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL: ${PROGENITOR_AZURE_STRUCTURED_RESPONSES_URL:-}
      PROGENITOR_AZURE_STRUCTURED_API_KEY: ${PROGENITOR_AZURE_STRUCTURED_API_KEY:-}
      PROGENITOR_AZURE_STRUCTURED_MODEL: ${PROGENITOR_AZURE_STRUCTURED_MODEL:-}
      # Workspace: clone the target repo here on first boot.
      # Set PROGENITOR_REPO_URL to auto-clone; or mount a pre-cloned repo to
      # /app/workspace and leave this unset.
      PROGENITOR_REPO_URL: ${PROGENITOR_REPO_URL:-}
      # Paths — these match the defaults baked into the Dockerfile ENV.
      PROGENITOR_PROJECT_ROOT: /app/workspace
      PROGENITOR_WORKTREE_DIR: /app/workspace/worktrees
    volumes:
      # Named volume: persists state across restarts (build_state.json, registry, etc.)
      - builder_agent_data:/app/data
      # Named volume: workspace holding the cloned repo + worktrees.
      # Lives here rather than on the host to avoid bind-mounting the whole repo.
      # Populated on first boot via PROGENITOR_REPO_URL clone.
      - builder_agent_workspace:/app/workspace
      # Bind mount logs to host logs/ dir; builder_agent writes to logs/builder_agent/
      - ../../logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8107/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 512M

volumes:
  builder_agent_data:
  builder_agent_workspace:
