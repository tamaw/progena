# ==============================================================================
# Shared Configuration (YAML Anchors)
# ==============================================================================
x-progena-llm-env: &progena-llm-env
  # Imported exactly once by provider persistence for legacy installations.
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
  AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
  PROGENA_MODEL_DEFAULT: ${PROGENA_MODEL_DEFAULT:-gpt-5.1-codex-max}
  # Selected environment-backed provider credentials.
  OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
  PROGENA_PROVIDER_ENCRYPTION_KEY: ${PROGENA_PROVIDER_ENCRYPTION_KEY:-}
  JINA_API_KEY: ${JINA_API_KEY:-}
  PROGENA_REASONING_ENABLED: ${PROGENA_REASONING_ENABLED:-true}
  PROGENA_REASONING_EFFORT: ${PROGENA_REASONING_EFFORT:-low}
  PROGENA_REASONING_SUMMARY: ${PROGENA_REASONING_SUMMARY:-auto}

x-progena-database-env: &progena-database-env
  PROGENA_DATABASE_URL: ${PROGENA_DATABASE_URL:-postgresql://progena:progena@postgres:5432/progena}
  BACKEND_DATABASE_NAME: ${BACKEND_DATABASE_NAME:-backend}
  PROGENA_DATABASE_SETUP: ${PROGENA_DATABASE_SETUP:-true}
  PROGENA_DATABASE_POOL_MIN_SIZE: ${PROGENA_DATABASE_POOL_MIN_SIZE:-1}
  PROGENA_DATABASE_POOL_MAX_SIZE: ${PROGENA_DATABASE_POOL_MAX_SIZE:-10}

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # pgvector: the knowledge index needs the `vector` extension.
    image: pgvector/pgvector:pg16
    container_name: progena-postgres
    restart: unless-stopped
    logging: *container-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-progena}
      POSTGRES_USER: ${POSTGRES_USER:-progena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-progena}
    volumes:
      - progena-postgres-data:/var/lib/postgresql/data
    networks:
      - progena-net
      - progena_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-progena} -d ${POSTGRES_DB:-progena}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Progena Application Stack
  # =============================================================================
  progena:
    image: ghcr.io/tamaw/progena:${PROGENA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/progena/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: progena
    restart: unless-stopped
    logging: *container-logging
    user: "10001:10001"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*progena-llm-env, *progena-database-env]
      AGENT_NAME: progena
      PROGENA_WORKTREE_DIR: /app/repos
      # Bind the runtime HTTP server on all interfaces so other containers (backend) can connect.
      PROGENA_HTTP_HOST: 0.0.0.0
      GH_TOKEN: ${GH_TOKEN:-}
      PROGENA_SHELL_HOME: /app/agent-home
      PROGENA_SHELL_WORKSPACE_DIR: /app/shell-workspaces
      PROGENA_SHELL_SHIM_BIN: /app/data/shims/bin
      PROGENA_SHELL_TIMEOUT_SECONDS: ${PROGENA_SHELL_TIMEOUT_SECONDS:-120}
      # State is transient in the hardened read-only runtime image.
      PROGENA_STATE_DIR: /app/tmp/state
      # The root filesystem is read-only; temp files go to the writable /app/tmp tmpfs.
      # Object-agent shells inherit this TMPDIR.
      TMPDIR: /app/tmp
      # Exchange volume shared with A2A agent containers; exposed to the agent as /shared/.
      PROGENA_SHARED_DIR: /shared
      # ACP detail reads are task-bound backend API calls; the runtime never mounts Claude config.
      PROGENA_BACKEND_URL: ${PROGENA_BACKEND_URL:-http://backend:8000}
      # Share glibc malloc arenas across threads so memory freed after large
      # transient histories is reused instead of pinned per thread arena.
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ${PROGENA_HOST_LOGS_DIR:-../logs}:/app/logs
      - ${PROGENA_HOST_REPOS_DIR:-../repos}:/app/repos
      # A fresh named volume inherits UID 10001 ownership from the image directory.
      - progena-shell-workspaces:/app/shell-workspaces
      - progena-shared:/shared
    # tmpfs mounts are root-owned unless uid/gid are set; the runtime runs as 10001.
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,size=1g,uid=10001,gid=10001,mode=0755
      - /app/agent-home:rw,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    stdin_open: true
    tty: true
    networks:
      - progena-net
      - progena_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${PROGENA_HTTP_PORT:-9501}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
          pids: 512
        reservations:
          memory: 512M

  backend:
    image: ghcr.io/tamaw/progena-backend:${PROGENA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: progena-backend
    restart: unless-stopped
    logging: *container-logging
    # Docker-internal only: trust the frontend's forwarded public scheme.
    command: ["python", "-m", "uvicorn", "src.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      postgres:
        condition: service_healthy
      progena:
        condition: service_started
    environment:
      <<: [*progena-llm-env, *progena-database-env]
      CHAT_SERVER_HOST: 0.0.0.0
      CHAT_SERVER_PORT: 8000
      CHAT_SERVER_PROGENA_TIMEOUT: 300
      PROGENA_WORKTREE_DIR: /app/repos
      # Backend runs in a separate container; connect to the runtime HTTP server via service DNS.
      PROGENA_RUNTIME_URL: http://progena:9501
      # Only the task-scoped ACP detail reader uses this read-only transcript mount.
      PROGENA_CLAUDE_TRANSCRIPT_ROOT: /var/lib/progena/claude/projects
      # Lossless generic ACP capture rolls to disk, not container RAM/tmpfs.
      PROGENA_ACP_CAPTURE_DIR: /app/logs/acp-capture
      # Telegram channel: seeds the first channel:telegram document (then the
      # Channels page owns its settings); TELEGRAM_BOT_TOKEN stays the token source.
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
      # See the progena service: cap glibc arenas to limit per-thread RSS retention.
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ${PROGENA_HOST_LOGS_DIR:-../logs}:/app/logs
      - ${PROGENA_HOST_REPOS_DIR:-../repos}:/app/repos
      # Never mount this into the runtime: backend resolves only verified task/session files.
      - ${PROGENA_HOST_CLAUDE_DIR:-../.claude-agent}:/var/lib/progena/claude:ro
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,size=512m
    networks:
      - progena-net
      - progena_network
    # Explicit Docker-only liveness exception; this endpoint returns an empty 200.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'
        reservations:
          memory: 256M

  frontend:
    image: ghcr.io/tamaw/progena-frontend:${PROGENA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: progena-frontend
    restart: unless-stopped
    logging: *container-logging
    depends_on:
      backend:
        condition: service_started
    ports:
      # The host nginx terminates public TLS and performs authentication.
      # Keep the frontend reachable only from localhost so it cannot bypass auth.
      - "127.0.0.1:8081:80"
    networks:
      - progena-net
      - progena_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

  # Claude Code over ACP (claude-agent-acp behind socat). Progena reaches it at
  # tcp://progena-agent-claude:3001 on the stack network; no host port.
  claude:
    image: ghcr.io/tamaw/progena-claude:${PROGENA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/claude/Dockerfile
    container_name: progena-agent-claude
    restart: unless-stopped
    logging: *container-logging
    environment:
      # Long-lived token from `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ${PROGENA_HOST_CLAUDE_DIR:-../.claude-agent}:/home/claude/.claude
      - ${PROGENA_HOST_REPOS_DIR:-../repos}:/app/repos
    networks:
      - progena-net
      - progena_network
    healthcheck:
      # A TCP probe would spawn a Claude process per check; the listener is enough.
      test: ["CMD", "pgrep", "-x", "socat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 256M

networks:
  progena-net:
    driver: bridge
  # Shared external network for progena stack components.
  progena_network:
    external: true

volumes:
  progena-shell-workspaces:
  progena-postgres-data:
    name: progena-postgres-data
    external: true
  # Create once: docker volume create progena-shared; agent containers mount it too.
  progena-shared:
    name: progena-shared
    external: true
